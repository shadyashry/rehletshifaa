# RehletShifaa API gateway — the single business-API entry point for browser clients.
#
#   Internet -> Cloudflare (TLS, WAF, DDoS) -> cloudflared -> this gateway -> RehletShifaa backend
#
# It owns cross-cutting edge concerns only: routing, request correlation, rate and size limits,
# upstream timeouts, security headers and access logging. It makes NO business decision — whether a
# patient owns a case, whether a proposal may be accepted or a deposit confirmed stays with the
# backend, which re-checks every request regardless of what reached it through here.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/json;

  # --- Client identity --------------------------------------------------------------------------
  # This listener has no public address: the only way in from the internet is Cloudflare's edge through
  # the cloudflared connector, which lives on the same private network. Cloudflare sets CF-Connecting-IP
  # from the connection it actually accepted and overwrites any value a client sends, so a header that
  # arrives from our private network is Cloudflare's verdict, not the client's claim — and that is the
  # only source we accept it from. X-Forwarded-For and X-Real-IP are never used for identity: a client
  # can prepend to those. Without the header (a container or the docker host probing the published
  # port) the connection address stands, which is the private network itself.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from fc00::/7;
  real_ip_header   CF-Connecting-IP;
  real_ip_recursive off;

  # One correlation id per request, reused when the client already sent one, so a browser error can
  # be traced through Cloudflare, this gateway and the backend logs.
  map $http_x_request_id $correlation_id { default $http_x_request_id; "" $request_id; }

  # Query strings and request bodies can carry patient data, so neither is logged. The Cloudflare ray
  # id joins this log to Cloudflare's own; no client address is written.
  log_format edge escape=json '{"ts":"$time_iso8601","requestId":"$correlation_id","cfRay":"$http_cf_ray",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"upstreamStatus":"$upstream_status","durationMs":$request_time,"bytes":$body_bytes_sent}';
  access_log /dev/stdout edge;
  error_log  /dev/stderr warn;
  server_tokens off;

  # --- Rate limiting ----------------------------------------------------------------------------
  # Budgets are per real client (see above) and shared across every worker, so the budget is the
  # gateway's, not one worker's. This is the edge guard; the backend enforces its own per-client
  # write budget as well.
  #
  # A CORS preflight is the browser asking permission, not the application asking for data: it maps
  # to an empty key and is never counted. Reads and writes are budgeted separately so a busy dashboard
  # cannot starve a save, and the budgets are sized from measured traffic: signing in and opening a
  # case is ~15 reads and ~15 preflights within two seconds; a patient's secure-link flow is ~5
  # requests. The public zone is the tightest because those routes carry one-time codes and links.
  map $request_method $api_read_key   { OPTIONS ""; GET $binary_remote_addr; HEAD $binary_remote_addr; default ""; }
  map $request_method $api_write_key  { OPTIONS ""; GET ""; HEAD ""; default $binary_remote_addr; }
  map $request_method $api_public_key { OPTIONS ""; default $binary_remote_addr; }
  limit_req_zone $api_read_key   zone=api_reads:10m  rate=300r/m;
  limit_req_zone $api_write_key  zone=api_writes:10m rate=60r/m;
  limit_req_zone $api_public_key zone=api_public:10m rate=30r/m;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=api_conns:10m;
  limit_conn_status 429;

  upstream rehletshifaa_backend { server backend:8080; keepalive 32; }

  server {
    listen 80;
    # Also v6: inside the container "localhost" resolves to ::1 first, so an v4-only listener made
    # every health probe fail against a gateway that was actually serving.
    listen [::]:80;
    # Uploads are capped here as well as in Spring so an oversized body is refused at the edge.
    client_max_body_size 16m;
    client_body_timeout 30s;
    limit_conn api_conns 64;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Request-ID $correlation_id always;

    # Gateway liveness, distinct from the backend's own actuator probe. Probes never spend a budget.
    location = /gateway/health { access_log off; return 200 '{"status":"UP","component":"api-gateway"}'; }

    # --- Business API -------------------------------------------------------------------------
    # One versioned prefix today, all of it served by the modular monolith. Extracting a module
    # later means adding a more specific location (e.g. /api/v1/notifications/) with its own
    # upstream — no frontend route changes, because clients only ever know /api/v1/*.
    location /api/v1/ {
      limit_req zone=api_reads  burst=60 nodelay;
      limit_req zone=api_writes burst=30 nodelay;
      proxy_pass http://rehletshifaa_backend;
      include /etc/nginx/conf.d/upstream.inc;
      proxy_read_timeout 30s;
    }

    # Unauthenticated secure-link and one-time-code flows: the tightest budget on the gateway.
    location /api/v1/public/ {
      limit_req zone=api_public burst=15 nodelay;
      proxy_pass http://rehletshifaa_backend;
      include /etc/nginx/conf.d/upstream.inc;
      proxy_read_timeout 30s;
    }

    # Provider webhooks arrive in bursts from the provider's own addresses; they are ordinary writes,
    # not code-entry attempts, and are authenticated by the backend against the provider's signature.
    location /api/v1/public/webhooks/ {
      limit_req zone=api_writes burst=30 nodelay;
      proxy_pass http://rehletshifaa_backend;
      include /etc/nginx/conf.d/upstream.inc;
      proxy_read_timeout 30s;
    }

    # Documents stream from object storage through the backend and can be slow; they get a longer
    # read timeout but the same routing, correlation and budgets.
    location /api/v1/documents/ {
      limit_req zone=api_reads  burst=60 nodelay;
      limit_req zone=api_writes burst=30 nodelay;
      proxy_pass http://rehletshifaa_backend;
      include /etc/nginx/conf.d/upstream.inc;
      proxy_read_timeout 120s;
    }

    location = /actuator/health { proxy_pass http://rehletshifaa_backend; include /etc/nginx/conf.d/upstream.inc; proxy_read_timeout 10s; }
    location /actuator/health/ { proxy_pass http://rehletshifaa_backend; include /etc/nginx/conf.d/upstream.inc; proxy_read_timeout 10s; }

    # Anything else is internal surface (actuator internals, swagger, container paths) and is not
    # part of the public API contract.
    location / { return 404 '{"code":"NOT_FOUND","message":"No such API route"}'; }
  }
}
