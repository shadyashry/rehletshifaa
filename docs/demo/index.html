<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RehletShifaa platform demo</title>
<meta name="description" content="A guided tour of one patient case on RehletShifaa, from the first visit to follow-up, with Arabic voice-over.">
<style>
:root{
  --paper:#f7f4ee;--paper-deep:#efeae0;--white:#fff;
  --petrol-50:#eef4f3;--petrol-100:#d9e8e6;--petrol-200:#b6d3cf;--petrol-300:#8cbab4;--petrol-600:#0e5f66;--petrol-700:#0e4f55;--petrol-900:#13292e;
  --ink-900:#14262b;--ink-600:#33474c;--ink-400:#5d6e72;
  --line:#e3ded4;--line-strong:#cfc8ba;--coral:#e07a5f;
  --radius:8px;
  --head:Alexandria,"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink-900);font:16px/1.55 var(--body);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--head);color:var(--petrol-900);margin:0;line-height:1.25;font-weight:600}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--petrol-600);outline-offset:2px}
/* top bar */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;background:var(--white);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.badge{flex:none;width:32px;height:32px;border-radius:8px;background:var(--petrol-600);display:grid;place-items:center}
.badge img{width:22px;height:22px;display:block}
.brand b{font-family:var(--head);font-weight:600;color:var(--petrol-900);font-size:1.05rem;white-space:nowrap}
.brand span{color:var(--ink-400);font-size:.875rem;white-space:nowrap}
.tools{display:flex;align-items:center;gap:12px}
.counter{font-size:.875rem;color:var(--ink-400);font-variant-numeric:tabular-nums;white-space:nowrap}
/* step rail */
.rail{background:var(--white);border-bottom:1px solid var(--line);padding:10px 28px 12px}
.rail ol{list-style:none;margin:0 auto;padding:0;display:flex;gap:6px;max-width:1320px}
.rail li{flex:1;min-width:0}
.rail button{display:block;width:100%;height:20px;background:none;border:0;padding:7px 0}
.rail button i{display:block;height:6px;border-radius:3px;background:var(--line);transition:background .2s}
.rail li.done button i{background:var(--petrol-200)}
.rail li.now button i{background:var(--petrol-600);height:6px}
.legend{display:flex;gap:16px;justify-content:space-between;align-items:center;max-width:1320px;margin:4px auto 0;font-size:.75rem;color:var(--ink-400)}
.legend .keys{display:flex;gap:10px}
/* chips */
.chip{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid var(--petrol-200);background:var(--petrol-50);color:var(--petrol-700);white-space:nowrap}
.chip.coordinator{background:var(--white);border-color:var(--petrol-600)}
.chip.consultant{background:var(--petrol-700);border-color:var(--petrol-700);color:#fff}
main{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:24px 28px 12px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
/* browser frame */
.frame{background:var(--white);border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.bar{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--paper-deep);border-bottom:1px solid var(--line)}
.bar .dots{display:flex;gap:6px}.bar .dots i{width:10px;height:10px;border-radius:50%;background:var(--line-strong)}
.bar .addr{flex:1;max-width:520px;margin:0 auto;background:var(--white);border:1px solid var(--line);border-radius:999px;font-size:.75rem;color:var(--ink-400);padding:3px 14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{width:46px}
.scroller{overflow-x:auto;background:var(--paper);text-align:center}
.shot{position:relative;display:inline-block;line-height:0;vertical-align:top;max-width:100%}
.shot img,.shot video{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 250px);margin:0 auto}
/* callouts: a brief logo-coral border flash (transparent inside) on the fields that matter; invisible otherwise */
.hs{position:absolute;border-radius:8px;border:2px solid transparent;background:transparent;padding:0;cursor:pointer;transition:border-color .25s ease,box-shadow .25s ease}
.hs.on{animation:none;border-color:#e07a5f;box-shadow:0 0 0 1px rgba(224,122,95,.3)}
.hs:hover{border-color:rgba(224,122,95,.4)}
@media (prefers-reduced-motion:reduce){.hs{transition:none}}
/* caption card */
aside.cap{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:22px;position:sticky;top:16px}
.rule{display:block;width:28px;height:3px;background:var(--coral);border-radius:2px;margin-bottom:12px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.meta small{color:var(--ink-400);font-size:.8rem}
aside h2{font-size:1.3rem;margin-bottom:8px}
aside p{margin:0 0 12px;color:var(--ink-600);font-size:.95rem}
aside ol{margin:0 0 14px;padding:0;list-style:none;font-size:.875rem;color:var(--ink-600)}
aside li{margin-bottom:4px}
aside li b{flex:none;width:20px;height:20px;border-radius:50%;background:#fde8d4;color:#9a4a16;font-size:.7rem;line-height:20px;text-align:center}
aside li button{display:flex;gap:10px;background:none;border:0;padding:2px 4px;margin:0 -4px;border-radius:6px;text-align:left;color:inherit;width:100%}aside li button:hover{background:#fdf3ea}
.why{border-top:1px solid var(--line);padding-top:12px;margin:0 0 4px}
.why strong{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--petrol-600);margin-bottom:2px}
details.ar{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:.85rem;color:var(--ink-600)}
details.ar summary{cursor:pointer;color:var(--petrol-700);font-weight:600}
details.ar p{direction:rtl;text-align:right;font-size:.95rem;line-height:1.9;margin:8px 0 0;font-family:"Segoe UI",Tahoma,system-ui,sans-serif}
.nav{display:flex;gap:10px;margin-top:14px}
.btn{border-radius:var(--radius);padding:10px 18px;font-weight:600;border:1px solid var(--petrol-600);background:var(--petrol-600);color:#fff}
.btn:hover{background:var(--petrol-700)}
.btn.ghost{background:var(--white);color:var(--petrol-700)}
.btn.ghost:hover{background:var(--petrol-50)}
.btn.sm{padding:7px 14px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:default}
.hint{font-size:.78rem;color:var(--ink-400);margin:10px 0 0}
.voice{display:flex;gap:8px;align-items:center}
.voice .btn svg{width:14px;height:14px;vertical-align:-2px;margin-inline-end:6px;fill:currentColor}
/* intro + closing */

/* in-slide motion on screenshot slides: cursor, click ripples, stamps, typed code. Start times come from --s, film mode steps --t */
.fx{position:absolute;inset:0;pointer-events:none;container-type:inline-size}
.cur{position:absolute;width:34px;height:34px;margin:-3px 0 0 -5px;opacity:0;transform-origin:5px 3px;animation-duration:var(--T);animation-timing-function:ease-in-out;animation-fill-mode:both;animation-delay:calc(0s - var(--t,0)*1s);filter:drop-shadow(0 2px 3px rgba(19,41,46,.35))}
.rip{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid var(--coral);opacity:0;animation:cRip .8s ease-out both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s)}
@keyframes cRip{0%{opacity:0;transform:scale(.2)}8%{opacity:.9}100%{opacity:0;transform:scale(1.7)}}
.hs{animation:hsFlash 1.3s ease both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s)}
@keyframes hsFlash{0%{border-color:transparent}14%{border-color:#e07a5f}82%{border-color:#e07a5f}100%{border-color:transparent}}
.patch{position:absolute;background:#fff;opacity:0;animation:cShow .01s both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s)}
@keyframes cShow{to{opacity:1}}
.stamp{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:.28cqw solid #d98f78;border-radius:.8cqw;color:#8f3b36;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:1.1cqw;line-height:1.25;background:rgba(255,255,255,.0);opacity:0;transform:rotate(-8deg);animation:cStamp .55s cubic-bezier(.2,.9,.25,1.2) both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s)}
.stamp hr{width:78%;border:0;border-top:.18cqw solid #d98f78;margin:.35cqw 0}
.stamp span{font-weight:600;letter-spacing:.05em;text-transform:none}
@keyframes cStamp{0%{opacity:0;transform:rotate(-2deg) scale(2.6)}55%{opacity:1;transform:rotate(-9deg) scale(.93)}75%{transform:rotate(-7.5deg) scale(1.04)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
.dots6{position:absolute;display:flex;align-items:center;gap:1.1cqw;padding-left:1cqw}
.dots6 i{width:1.15cqw;height:1.15cqw;border-radius:50%;background:var(--ink-900);opacity:0;animation:cShow .01s both,cDotPop .25s ease both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s),calc(var(--s,0)*1s - var(--t,0)*1s)}
@keyframes cDotPop{from{transform:scale(.3)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cur,.rip{display:none}.hs{animation:none}.stamp{animation:none;opacity:1}.patch{animation:none;opacity:1}.dots6 i{animation:none;opacity:1}}
body.film .fx *,body.film .hs{animation-play-state:paused!important}

/* cinematic intro: a fixed 1600x900 scene scaled to fit; every element has a start time --s (film mode steps --t) */
.cine{position:relative;background:var(--paper);border-radius:12px;overflow:hidden;aspect-ratio:16/9;width:100%;max-width:1240px;margin:8px auto}
.scene{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;color:var(--ink-900);font-family:var(--body)}
.scene .ico{stroke:currentColor}
.c{opacity:0;animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s)}
.bgarcs{position:absolute;left:700px;top:-200px;width:1300px;height:1300px;animation:cSpin 120s linear infinite;animation-delay:calc(var(--t,0)*-1s)}
.bgarcs circle{fill:none;stroke:#e6e0d3;stroke-width:2}
@keyframes cSpin{to{transform:rotate(360deg)}}
.cbrand{position:absolute;left:0;top:0;transform-origin:0 0;animation:cBrand 2.4s cubic-bezier(.65,0,.25,1) both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s);opacity:0}
.cbrand img{height:150px;width:auto;display:block}
@keyframes cBrand{0%{opacity:0;transform:translate(508px,375px) scale(.7)}22%{opacity:1;transform:translate(508px,375px) scale(1)}58%{opacity:1;transform:translate(508px,375px) scale(1)}100%{opacity:1;transform:translate(48px,30px) scale(.42)}}
.cburst{position:absolute;left:800px;top:450px;width:130px;height:130px;border-radius:50%;border:3px solid var(--coral);opacity:0;animation:cRing 1.3s ease-out both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s)}
.cburst.b2{border-color:var(--petrol-200)}
@keyframes cRing{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}8%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}}
/* journey line (becomes the roadmap strip at the bottom) */
.jr{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:800px 450px;animation:cStrip 1s cubic-bezier(.65,0,.25,1) both,cDim .6s ease both;animation-delay:calc(5.6s - var(--t,0)*1s),calc(13.2s - var(--t,0)*1s)}
@keyframes cStrip{to{transform:translateY(285px) scale(.52)}}
@keyframes cDim{to{opacity:.35}}
.jr svg.path{position:absolute;left:0;top:0;width:1600px;height:900px;overflow:visible}
.jr .dots{fill:none;stroke:var(--petrol-300);stroke-width:3;stroke-dasharray:2 14;stroke-linecap:round;opacity:0;animation:cFade .8s ease-out both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s)}
.jr .trail{fill:none;stroke:var(--petrol-600);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;animation:cDraw var(--d) linear both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s)}
@keyframes cFade{to{opacity:.55}}
@keyframes cDraw{to{stroke-dashoffset:0}}
.cplane{position:absolute;left:0;top:0;width:72px;height:72px;offset-path:path("M170 610 C 540 250, 1060 250, 1430 610");offset-rotate:auto 45deg;offset-anchor:50% 50%;animation:cFly var(--d) linear both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s);opacity:0}
.cplane .ico{width:72px;height:72px;stroke:var(--coral);stroke-width:1.5}
@keyframes cFly{0%{offset-distance:0%;opacity:0}3%{opacity:1}94%{opacity:1}100%{offset-distance:100%;opacity:0}}
.cn{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;animation-name:cPop;animation-duration:.55s}
.cn .rg{width:76px;height:76px;border-radius:50%;background:var(--petrol-600);border:4px solid #fff;box-shadow:0 0 0 2px var(--petrol-200);display:grid;place-items:center;color:#fff}
.cn .ico{width:36px;height:36px}
.cn em{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:28px;font-weight:600;color:var(--petrol-900)}
.cn em.up{top:-56px}.cn em.dn{top:92px}
@keyframes cPop{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
.cend{position:absolute;color:var(--ink-400);font-size:24px;animation-name:cUp}
.cend i{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--petrol-900)}
.cend span{position:absolute;left:-30px;top:26px}
@keyframes cUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
/* three animated cards */
.pc{position:absolute;top:170px;width:450px;height:430px;border:2px solid var(--petrol-200);border-radius:16px;background:#fff;padding:34px;animation:cCard .8s cubic-bezier(.2,.8,.2,1) both,cOut .6s ease-in both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s),calc(13.2s - var(--t,0)*1s);opacity:0}
.pc::before{content:"";position:absolute;left:34px;top:-3px;width:84px;height:6px;border-radius:3px;background:var(--coral)}
@keyframes cCard{from{opacity:0;transform:translateY(80px) scale(.94)}to{opacity:1;transform:none}}
@keyframes cOut{to{opacity:0;transform:translateY(-50px)}}
.pc .ic{position:relative;width:96px;height:96px;border-radius:50%;border:3px solid var(--coral);display:grid;place-items:center;color:var(--coral)}
.pc .ic .ico{width:50px;height:50px;stroke:var(--coral)}
.pc h3{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.15;color:var(--petrol-900);margin:26px 0 10px}
.pc p{font-size:26px;line-height:1.4;color:var(--ink-600);margin:0}
.pc .ic .pr{position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--coral);opacity:0;animation:cRing2 1.6s ease-out both;animation-delay:calc(var(--s,0)*1s + .6s - var(--t,0)*1s)}
.pc .ic .pr.p2{animation-delay:calc(var(--s,0)*1s + 1.2s - var(--t,0)*1s)}
@keyframes cRing2{0%{opacity:0;transform:scale(1)}8%{opacity:.9}100%{opacity:0;transform:scale(2.2)}}
.pc .tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.pc .tags span{font-size:21px;font-weight:600;border:2px solid var(--petrol-300);border-radius:999px;padding:5px 16px;color:var(--paper);animation:cUp .5s ease both;animation-delay:calc(var(--s,0)*1s + var(--o,1)*1s - var(--t,0)*1s);opacity:0}
.pc .bub{display:inline-block;border-radius:20px;padding:8px 16px;font-size:24px;font-weight:600;margin:20px 8px 0 0;opacity:0;animation:cPop .5s ease both;animation-delay:calc(var(--s,0)*1s + var(--o,1)*1s - var(--t,0)*1s)}
.pc .bub.l{background:var(--petrol-600);color:#fff;direction:rtl;border-bottom-right-radius:4px}
.pc .bub.r{background:#fff;border:1.5px solid var(--line-strong);color:var(--petrol-900);border-bottom-left-radius:4px}
.pc .bars{display:flex;align-items:flex-end;gap:16px;height:96px;margin-top:6px}
.pc .bars i{display:block;width:34px;background:var(--petrol-300);border-radius:6px 6px 0 0;transform-origin:bottom;transform:scaleY(0);animation:cGrow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--s,0)*1s + var(--o,1)*1s - var(--t,0)*1s)}
.pc .bars i:nth-child(3){background:var(--coral)}
@keyframes cGrow{to{transform:scaleY(1)}}
.ctag{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:var(--head);font-weight:600;font-size:104px;line-height:1.1;color:var(--petrol-900);animation-name:cUp;animation-duration:.9s}
.ctag::before{content:"";display:block;width:84px;height:6px;background:var(--coral);border-radius:3px;margin:0 auto 28px}
.csub{position:absolute;left:0;right:0;top:535px;text-align:center;font-size:36px;color:var(--ink-600);animation-name:cUp}
.ccta{position:absolute;left:0;right:0;bottom:14px;display:flex;gap:12px;justify-content:center;animation-name:cUp;animation-duration:.6s;z-index:3}
.ccta .btn.ghost{background:#fff;color:var(--petrol-700);border-color:var(--petrol-600)}
@media (prefers-reduced-motion:reduce){.c,.cbrand,.jr .dots,.jr .trail,.cburst,.pc,.pc *,.bgarcs{animation:none!important}.c,.cn,.ctag,.csub,.ccta,.pc,.pc .tags span,.pc .bub{opacity:1}.cbrand{opacity:1;transform:translate(56px,44px) scale(.62)}.jr .trail{stroke-dashoffset:0}.jr .dots{opacity:.55}.pc .bars i{transform:none}.cplane,.cburst,.pr{display:none}.pc{display:none}}
body.film.intro-on header.top,body.film.intro-on .rail{display:none}
body.film.intro-on main{padding:0;max-width:none}
body.film.intro-on .cine{max-width:none;margin:0;border-radius:0;width:100vw;height:100vh;aspect-ratio:auto}
body.film.intro-on .ccta{display:none}
@media (max-width:640px){.ccta{bottom:6px}.ccta .btn{padding:8px 12px;font-size:.8rem}}
.solo{position:relative;width:210px;height:210px;border-radius:50%;background:var(--petrol-600);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--head);font-weight:600;font-size:1.2rem}
.solo .ico{stroke:#fff;width:68px;height:68px}
.halo{position:absolute;inset:0;border-radius:50%;border:3px solid var(--petrol-300);opacity:0;animation:cHalo 2.4s ease-out infinite;animation-delay:calc(var(--s,0)*1s + 1s - var(--t,0)*1s)}
.halo.h2{animation-delay:calc(var(--s,0)*1s + 2.2s - var(--t,0)*1s)}
@keyframes cHalo{0%{opacity:0;transform:scale(1)}10%{opacity:.85}100%{opacity:0;transform:scale(1.42)}}
.solo{margin:34px 0 26px}
.duo{display:flex;gap:22px;align-items:stretch;justify-content:center;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:10px;padding:22px 26px;background:var(--white);display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:230px;text-align:left}
.card b{font-family:var(--head);font-size:1.15rem;color:var(--petrol-900)}
.card.muted{opacity:.7;background:var(--paper);align-items:center;text-align:center}
.card.muted .ico{stroke:var(--ink-400);width:36px;height:36px}
.card .no{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--ink-400)}.card .no .ico{width:20px;height:20px;stroke:var(--ink-400)}
.card.hero{border:2px solid var(--petrol-600);box-shadow:0 0 0 4px var(--petrol-50)}
.card.hero>.ico{width:40px;height:40px}
.card ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.card li{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--ink-600)}.card li .ico{width:20px;height:20px}

/* motion visuals (intro, finance, travel): every element has a start time --s; film mode steps time with --t */
.a{opacity:0;animation:aIn .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s)}
@keyframes aIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.ln{display:block;height:2px;background:var(--petrol-300);position:relative;transform-origin:left center;transform:scaleX(0);animation:aLine .7s ease-out both;animation-delay:calc(var(--s,0)*1s - var(--t,0)*1s)}
@keyframes aLine{to{transform:scaleX(1)}}
.ln::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:8px solid var(--petrol-300);border-right:0}
.ico{width:28px;height:28px;fill:none;stroke:var(--petrol-600);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

const total=steps.length;
const stage=document.getElementById('stage'),counter=document.getElementById('counter'),rail=document.getElementById('rail'),sub=document.getElementById('sub'),playBtn=document.getElementById('play');
const film=/[?&]film=1/.test(location.search);if(film)document.body.classList.add('film');
let cur=0,tour=false,audio=null,timer=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip=r=>`<span class="chip ${r==='Finance'||r==='Operations'?'team':r.toLowerCase()}">${r}</span>`;
function intro(){
 const P=[[170,610],[540,250],[1060,250],[1430,610]];
 const bez=t=>{const u=1-t;return [0,1].map(i=>u*u*u*P[0][i]+3*u*u*t*P[1][i]+3*u*t*t*P[2][i]+t*t*t*P[3][i])};
 const NS=400,pts=[],cum=[0];for(let i=0;i<=NS;i++){pts.push(bez(i/NS));if(i)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]))}
 const at=u=>{const L=cum[NS]*u;let i=cum.findIndex(c=>c>=L);if(i<1)i=1;const f=(L-cum[i-1])/((cum[i]-cum[i-1])||1);return [0,1].map(k=>pts[i-1][k]+(pts[i][k]-pts[i-1][k])*f)};
 const FS=2.4,FD=3.0;
 const ms=[['file','Send your case'],['chat','Coordinator prepares'],['steth','Consultant reviews'],['receipt','Your proposal'],['bank','Deposit'],['bed','Treatment'],['phone','Follow-up']];
 const nodes=ms.map(([ic,lb],k)=>{const u=0.05+0.15*k,[x,y]=at(u);return `<div class="c cn" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;--s:${(FS+FD*u-0.15).toFixed(2)}"><span class="rg">${svg(ic)}</span><em class="${k%2?'up':'dn'}">${lb}</em></div>`}).join('');
 const arcs=[300,430,560,690].map(r=>`<circle cx="650" cy="650" r="${r}"/>`).join('');
 return `<section class="cine anim" aria-label="Animated introduction: from the first message to follow-up, reviewed by a highly experienced Consultant, with one multilingual coordinator and a cost estimate"><div class="scene" id="scene">
<svg class="bgarcs" viewBox="0 0 1300 1300" aria-hidden="true">${arcs}</svg>
<span class="cburst" style="--s:.5"></span><span class="cburst b2" style="--s:.8"></span>
<div class="cbrand" style="--s:0.1"><img src="assets/logo.png" alt="RehletShifaa, رحلة شفاء"></div>
<div class="jr">
<svg class="path" viewBox="0 0 1600 900" aria-hidden="true"><path class="dots" style="--s:2.0" d="M170 610 C 540 250, 1060 250, 1430 610"/><path class="trail" pathLength="1" style="--s:${FS};--d:${FD}s" d="M170 610 C 540 250, 1060 250, 1430 610"/></svg>
<div class="c cend" style="left:170px;top:610px;--s:2.2"><i></i><span style="left:-112px;top:-14px">Home</span></div>
<div class="c cend" style="left:1430px;top:610px;--s:2.2"><i></i><span style="left:32px;top:-14px">Egypt</span></div>
${nodes}
<span class="cplane" style="--s:${FS};--d:${FD}s">${svg('plane')}</span>
</div>
<div class="pc" style="left:90px;--s:5.8"><div class="ic">${svg('steth')}<i class="pr"></i><i class="pr p2"></i></div><h3>Reviewed by a Consultant</h3><p>A highly experienced specialist in your care area.</p></div>
<div class="pc" style="left:575px;--s:8.2"><div class="ic">${svg('chat')}</div><h3>One multilingual coordinator</h3><p>With you from the first message to follow-up.</p><span class="bub l" style="--o:.9" lang="ar">مرحبًا</span><span class="bub r" style="--o:1.4">Hello</span><span class="bub r" style="--o:1.9">Bonjour</span></div>
<div class="pc" style="left:1060px;--s:10.6"><div class="ic">${svg('bars')}</div><h3>Cost estimate</h3><p>A preliminary estimate, never a final price.</p><div class="bars"><i style="height:40px;--o:.9"></i><i style="height:66px;--o:1.1"></i><i style="height:92px;--o:1.3"></i></div></div>
<h2 class="c ctag" style="--s:13.4">One case. One journey.</h2>
<p class="c csub" style="--s:14.1">Specialist care in Egypt for international patients.</p>
</div>
<div class="cta ccta c" style="--s:14.7"><button class="btn" data-go="1">Start the tour</button><button class="btn ghost" id="introPlay" type="button">Play with Arabic voice-over</button></div></section>`}
function fitCine(){const c=document.querySelector('.cine'),s=document.getElementById('scene');if(c&&s)s.style.transform=`scale(${c.clientWidth/1600})`}
window.addEventListener('resize',fitCine);
function visual(k){
 if(k==='consultant')return `<div class="vis anim"><div class="a" style="--s:0"><h3>Reviewed by a Consultant</h3><p class="vsub">A highly experienced specialist in your care area.</p></div>
<div class="solo a" style="--s:.5"><span class="halo"></span><span class="halo h2"></span>${svg('steth')}<b>Consultant</b></div>
<span class="badge-op a" style="--s:2">Reviews before you travel, pay or decide</span></div>`;
 if(k==='finance')return `<div class="vis anim"><div class="a" style="--s:0"><h3>Our finance team</h3><p class="vsub">Every invoice and every transfer is checked before anything is confirmed.</p></div>
<div class="fin"><div class="col"><div class="tile a" style="--s:.5">${svg('receipt')}Invoice</div><div class="tile a" style="--s:.8">${svg('bank')}Bank transfer</div></div>
<span class="ln" style="--s:1.2"></span><div class="core a" style="--s:1.5">${svg('search')}Finance team</div><span class="ln" style="--s:2.1"></span>
<div class="col"><div class="tile ok a" style="--s:2.5">${svg('check')}Invoice checked</div><div class="tile ok a" style="--s:2.8">${svg('check')}Transfer confirmed</div></div></div></div>`;
 return `<div class="vis anim"><div class="a" style="--s:0"><h3>Travel and stay, arranged</h3><p class="vsub">Flights, visa support and hotel, through our operators.</p></div>
<div class="route a" style="--s:.4"><svg viewBox="0 0 600 130" preserveAspectRatio="none" aria-hidden="true"><path d="M10 118 Q300 -50 590 118" fill="none" stroke="#b6d3cf" stroke-width="2" stroke-dasharray="6 7" vector-effect="non-scaling-stroke"/></svg><span class="plane" style="--s:.9">${svg('plane')}</span><small style="left:0">Home</small><small style="right:0">Egypt</small></div>
<div class="tiles"><div class="tile a" style="--s:1.8">${svg('plane')}Flights</div><div class="tile a" style="--s:2.2">${svg('visa')}Visa support</div><div class="tile a" style="--s:2.6">${svg('bed')}Hotel</div></div>
<span class="badge-op a" style="--s:3.2">Through our operators</span></div>`;
}
function closing(){
 const lanes=[['Patient',r=>r==='Patient'],['Coordinator',r=>r==='Coordinator'],['Consultant',r=>r==='Consultant'],['Support team',r=>r==='Finance'||r==='Operations']];
 const grid=`<div class="grid" style="grid-template-columns:104px repeat(${steps.length},minmax(30px,1fr))"><div></div>${steps.map((s,i)=>`<div class="h">${i+1}</div>`).join('')}`+lanes.map(([l,f])=>`<div class="lane">${l}</div>`+steps.map((s,i)=>`<div class="c">${f(s.role)?`<button data-go="${i+1}" aria-label="Step ${i+1}: ${esc(s.title)}">${i+1}</button>`:''}</div>`).join('')).join('')+`</div>`;
 return `<section class="panel"><span class="rule"></span><h1>The journey at a glance</h1>
<p>Who sees what, at each of the ${total} steps. Select a step to revisit it.</p>
<div class="lanes">${grid}</div>
<div class="list">${steps.map((s,i)=>`<button data-go="${i+1}"><span class="n">${i+1}</span><span class="t">${esc(s.title)}</span></button>`).join('')}</div>
<div class="notshown"><h2>Not shown yet</h2><ul>
<li>The final quote, and the patient's own outcome questionnaire (step 17 shows the team's view of follow-up).</li>
<li>An Arabic interface: the voice-over is Arabic, the screens are English.</li>
<li>Steps 14 to 17 show the Consultant's view of the case file.</li>
</ul></div>
<div class="cta"><button class="btn ghost" data-go="${total}">Back</button><button class="btn" data-go="0">Restart</button></div></section>`}
function fxLayer(i,s){
 let T=0;
 const hs=s.hs||[],fx=s.fx||{};
 let out='',arr=[];
 hs.forEach((q,k)=>{arr.push(1.1+k*2.4)});
 (fx.stamps||[]).forEach(t=>{
  out+=`<div class="patch" style="left:${t.px}%;top:${t.py}%;width:${t.pw}%;height:${t.ph}%;--s:${t.s}"></div>`;
  out+=`<div class="stamp" style="left:${t.x}%;top:${t.y}%;width:${t.w}%;height:${t.h}%;--s:${t.s}">${t.lines.map((l,j)=>j===t.lines.length-1&&t.lines.length>1?`<hr><span>${l}</span>`:`<b>${l}</b>`).join('')}</div>`;
  T=Math.max(T,t.s+1.2)});
 if(fx.type){const t=fx.type,s0=(arr[0]||1.5)+.3;out+=`<div class="dots6" style="left:${t.x}%;top:${t.y}%;width:${t.w}%;height:${t.h}%">${[0,1,2,3,4,5].map(j=>`<i style="--s:${(s0+j*.22).toFixed(2)}"></i>`).join('')}</div>`;T=Math.max(T,s0+1.6)}
 if(hs.length){T=Math.max(T,arr[arr.length-1]+1.6)}
 window.fxEnd=T;
 return out?`<div class="fx" aria-hidden="true">${out}</div>`:''}
function step(i){
 const s=steps[i-1];
 const hs=s.hs.map((h,k)=>`<button class="hs" data-n="${k+1}" aria-label="${esc(h.t)}" style="left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%;--s:${(1.1+k*2.4).toFixed(2)}"></button>`).join('');
 return `<div class="layout"><div class="frame"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="addr">${esc(s.view)}</span><span class="sp"></span></div>
 <div class="scroller">${s.kind==='anim'?visual(s.anim):`<div class="shot">${s.video?`<video id="heroVid" src="${IMG}${s.video}" poster="${IMG}${s.img}" width="${s.w}" height="${s.h}" muted loop playsinline autoplay aria-label="${esc(s.alt)}"></video>`:`<img src="${IMG}${s.img}" width="${s.w}" height="${s.h}" alt="${esc(s.alt)}">`}${fxLayer(i,s)}${hs}</div>`}</div></div>
 <aside class="cap" aria-live="polite"><span class="rule"></span>
 <div class="meta">${chip(s.role)}<small>Step ${i} of ${total}</small></div>
 <h2>${esc(s.title)}</h2><p>${esc(s.cap)}</p>
 ${s.hs.length?`<ol>${s.hs.map((h,k)=>`<li><button type="button" data-flash="${k}"><b>${k+1}</b><span>${esc(h.t)}</span></button></li>`).join('')}</ol>`:''}
 <div class="why"><strong>Why it matters</strong>${esc(s.why)}</div>
 <details class="ar"><summary>Arabic voice-over text</summary><p lang="ar" dir="rtl">${esc(AR[i]||'')}</p></details>
 <div class="nav"><button class="btn ghost" data-go="${i-1}">Back</button><button class="btn" data-go="${i+1}">${i===total?'Summary':'Next'}</button></div>
 <p class="hint">${s.hs.length?'Key points flash briefly. Select one in the list to see it again, and press → to continue.':'Press → to continue.'}</p></aside></div>`}
function stopAudio(){clearTimeout(timer);if(audio){audio.onended=null;audio.pause();audio=null}}
function playAudio(){
 stopAudio();if(!tour)return;
 const n=String(cur).padStart(2,'0');audio=new Audio(AUD+'ar-'+n+'.mp3');
 audio.onended=()=>{timer=setTimeout(()=>{if(cur>total){setTour(false)}else go(cur+1)},900)};
 audio.play().catch(()=>setTour(false));
}
let bgm=null;
function setTour(on){
 tour=on;
 if(on){if(!bgm){bgm=new Audio(AUD+'music.mp3');bgm.loop=true;bgm.volume=.13}bgm.play().catch(()=>{})}else if(bgm){bgm.pause()}playBtn.setAttribute('aria-pressed',on);
 playBtn.querySelector('span').textContent=on?'Pause voice-over':'Play with Arabic voice-over';
 playBtn.querySelector('svg').innerHTML=on?'<path d="M2.5 1.5h3v11h-3zM8.5 1.5h3v11h-3z"/>':'<path d="M3 1.5v11l9-5.5z"/>';
 if(on)playAudio();else stopAudio();
}
function render(){
 window.fxEnd=0;
 stage.innerHTML=cur===0?intro():cur>total?closing():step(cur);
 document.body.classList.toggle('intro-on',cur===0);fitCine();
 rail.innerHTML=steps.map((s,i)=>`<li class="${i+1<cur?'done':i+1===cur?'now':''}"><button data-go="${i+1}" aria-label="Step ${i+1}: ${esc(s.title)}" ${i+1===cur?'aria-current="step"':''}><i></i></button></li>`).join('');
 counter.textContent=cur===0?'Introduction':cur>total?'Summary':`Step ${cur} of ${total}`;
 sub.textContent=AR[cur]||'';sub.classList.toggle('long',(AR[cur]||'').length>230);
 document.title=(cur&&cur<=total?`${cur}. ${steps[cur-1].title} – `:'')+'RehletShifaa platform demo';
 const ip=document.getElementById('introPlay');if(ip)ip.onclick=()=>{go(1);setTour(true)};
 if(!film)window.scrollTo(0,0);
 playAudio();flashAll();
}
function go(n){cur=Math.max(0,Math.min(total+1,n));render()}
window.go=go;window.setT=t=>document.documentElement.style.setProperty('--t',t);
let flashTimers=[];
function flash(k){const el=stage.querySelectorAll('.hs')[k];if(!el)return;el.classList.add('on');flashTimers.push(setTimeout(()=>el.classList.remove('on'),1100))}
function flashAll(){flashTimers.forEach(clearTimeout);flashTimers=[]}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-go]');if(b){go(+b.dataset.go);return}
 const f=e.target.closest('[data-flash]');if(f){flashTimers.forEach(clearTimeout);stage.querySelectorAll('.hs').forEach(x=>x.classList.remove('on'));flash(+f.dataset.flash);return}
 const hs=e.target.closest('.hs');if(hs){const k=[...stage.querySelectorAll('.hs')].indexOf(hs);flash(k)}
});
playBtn.addEventListener('click',()=>{if(cur===0)go(1);setTour(!tour)});
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);
});
render();
</script>
</body>
