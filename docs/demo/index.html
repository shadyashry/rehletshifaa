<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RehletShifaa platform demo</title>
<meta name="description" content="A guided tour of one patient case on RehletShifaa, from the first visit to follow-up, with Arabic voice-over.">
<style>
:root{
  --paper:#f7f4ee;--paper-deep:#efeae0;--white:#fff;
  --petrol-50:#eef4f3;--petrol-100:#d9e8e6;--petrol-200:#b6d3cf;--petrol-300:#8cbab4;--petrol-600:#0e5f66;--petrol-700:#0e4f55;--petrol-900:#13292e;
  --ink-900:#14262b;--ink-600:#33474c;--ink-400:#5d6e72;
  --line:#e3ded4;--line-strong:#cfc8ba;--coral:#e07a5f;
  --radius:8px;
  --head:Alexandria,"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink-900);font:16px/1.55 var(--body);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--head);color:var(--petrol-900);margin:0;line-height:1.25;font-weight:600}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--petrol-600);outline-offset:2px}
/* top bar */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;background:var(--white);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.badge{flex:none;width:32px;height:32px;border-radius:8px;background:var(--petrol-600);display:grid;place-items:center}
.badge img{width:22px;height:22px;display:block}
.brand b{font-family:var(--head);font-weight:600;color:var(--petrol-900);font-size:1.05rem;white-space:nowrap}
.brand span{color:var(--ink-400);font-size:.875rem;white-space:nowrap}
.tools{display:flex;align-items:center;gap:12px}
.counter{font-size:.875rem;color:var(--ink-400);font-variant-numeric:tabular-nums;white-space:nowrap}
/* step rail */
.rail{background:var(--white);border-bottom:1px solid var(--line);padding:10px 28px 12px}
.rail ol{list-style:none;margin:0 auto;padding:0;display:flex;gap:6px;max-width:1320px}
.rail li{flex:1;min-width:0}
.rail button{display:block;width:100%;height:20px;background:none;border:0;padding:7px 0}
.rail button i{display:block;height:6px;border-radius:3px;background:var(--line);transition:background .2s}
.rail li.done button i{background:var(--petrol-200)}
.rail li.now button i{background:var(--petrol-600);height:6px}
.legend{display:flex;gap:16px;justify-content:space-between;align-items:center;max-width:1320px;margin:4px auto 0;font-size:.75rem;color:var(--ink-400)}
.legend .keys{display:flex;gap:10px}
/* chips */
.chip{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid var(--petrol-200);background:var(--petrol-50);color:var(--petrol-700);white-space:nowrap}
.chip.coordinator{background:var(--white);border-color:var(--petrol-600)}
.chip.consultant{background:var(--petrol-700);border-color:var(--petrol-700);color:#fff}
main{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:24px 28px 12px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
/* browser frame */
.frame{background:var(--white);border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.bar{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--paper-deep);border-bottom:1px solid var(--line)}
.bar .dots{display:flex;gap:6px}.bar .dots i{width:10px;height:10px;border-radius:50%;background:var(--line-strong)}
.bar .addr{flex:1;max-width:520px;margin:0 auto;background:var(--white);border:1px solid var(--line);border-radius:999px;font-size:.75rem;color:var(--ink-400);padding:3px 14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{width:46px}
.scroller{overflow-x:auto;background:var(--paper);text-align:center}
.shot{position:relative;display:inline-block;line-height:0;vertical-align:top;max-width:100%}
.shot img{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 250px);margin:0 auto}
/* callouts: outline only, no fill */
.hs{position:absolute;border-radius:8px;border:2px solid var(--petrol-600);background:transparent;padding:0;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.hs::after{content:"";position:absolute;inset:-3px;border-radius:10px;border:2px solid var(--petrol-600);animation:pulse 2s ease-out infinite;pointer-events:none}
.hs b{position:absolute;top:-12px;left:-12px;width:24px;height:24px;border-radius:50%;background:var(--petrol-600);color:#fff;font:600 .78rem/24px var(--body);text-align:center;box-shadow:0 0 0 2px #fff}
.hs em{position:absolute;left:16px;top:-14px;transform:translateY(-100%);background:var(--petrol-900);color:#fff;font:500 .72rem/1.2 var(--body);font-style:normal;padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;line-height:1.3}
.hs.below em{top:auto;bottom:-14px;transform:translateY(100%)}
@keyframes pulse{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.05,1.14)}}
@media (prefers-reduced-motion:reduce){.hs::after{animation:none;opacity:.3}.rail button i{transition:none}}
/* caption card */
aside.cap{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:22px;position:sticky;top:16px}
.rule{display:block;width:28px;height:3px;background:var(--coral);border-radius:2px;margin-bottom:12px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.meta small{color:var(--ink-400);font-size:.8rem}
aside h2{font-size:1.3rem;margin-bottom:8px}
aside p{margin:0 0 12px;color:var(--ink-600);font-size:.95rem}
aside ol{margin:0 0 14px;padding:0;list-style:none;font-size:.875rem;color:var(--ink-600)}
aside li{display:flex;gap:10px;margin-bottom:6px}
aside li b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--petrol-600);color:#fff;font-size:.7rem;line-height:20px;text-align:center}
.why{border-top:1px solid var(--line);padding-top:12px;margin:0 0 4px}
.why strong{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--petrol-600);margin-bottom:2px}
details.ar{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:.85rem;color:var(--ink-600)}
details.ar summary{cursor:pointer;color:var(--petrol-700);font-weight:600}
details.ar p{direction:rtl;text-align:right;font-size:.95rem;line-height:1.9;margin:8px 0 0;font-family:"Segoe UI",Tahoma,system-ui,sans-serif}
.nav{display:flex;gap:10px;margin-top:14px}
.btn{border-radius:var(--radius);padding:10px 18px;font-weight:600;border:1px solid var(--petrol-600);background:var(--petrol-600);color:#fff}
.btn:hover{background:var(--petrol-700)}
.btn.ghost{background:var(--white);color:var(--petrol-700)}
.btn.ghost:hover{background:var(--petrol-50)}
.btn.sm{padding:7px 14px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:default}
.hint{font-size:.78rem;color:var(--ink-400);margin:10px 0 0}
.voice{display:flex;gap:8px;align-items:center}
.voice .btn svg{width:14px;height:14px;vertical-align:-2px;margin-inline-end:6px;fill:currentColor}
/* intro + closing */
.panel{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:44px 40px;max-width:900px;margin:12px auto}
.panel h1{font-size:clamp(1.6rem,4vw,2.3rem);margin-bottom:14px}
.panel p{color:var(--ink-600);margin:0 0 14px;max-width:62ch}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:24px 0}
.pts div{border:1px solid var(--line);border-top:3px solid var(--petrol-600);border-radius:var(--radius);padding:14px 16px;background:var(--paper);font-size:.9rem;color:var(--ink-600)}
.pts b{display:block;font-family:var(--head);font-weight:600;color:var(--petrol-900);margin-bottom:4px;font-size:.98rem}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.lanes{overflow-x:auto;margin:22px 0 8px}
.grid{display:grid;grid-template-columns:104px repeat(14,minmax(38px,1fr));align-items:center;min-width:700px;row-gap:0}
.grid .h{font-size:.72rem;color:var(--ink-400);text-align:center;padding:2px 0}
.grid .lane{font-size:.75rem;font-weight:600;color:var(--petrol-700);text-transform:uppercase;letter-spacing:.05em;padding-right:8px}
.grid .c{height:44px;display:grid;place-items:center;border-top:1px solid var(--line);position:relative}
.grid .lane{height:44px;display:flex;align-items:center;border-top:1px solid var(--line)}
.grid .c button{width:26px;height:26px;border-radius:50%;border:2px solid var(--petrol-600);background:var(--petrol-600);color:#fff;font-size:.7rem;font-weight:600;padding:0}
.grid .c button:hover{background:var(--petrol-700)}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:4px 28px;margin:18px 0}
.list button{background:none;border:0;padding:4px 0;text-align:left;color:var(--ink-900);display:flex;gap:10px;align-items:baseline;width:100%}
.list button:hover span.t{text-decoration:underline}
.list .n{font-variant-numeric:tabular-nums;color:var(--ink-400);width:1.6em;flex:none}
.notshown{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.notshown h2{font-size:1.05rem;margin-bottom:6px}
.notshown ul{margin:0;padding-left:20px;color:var(--ink-600);font-size:.9rem}
footer{padding:12px 28px 20px;text-align:center;font-size:.78rem;color:var(--ink-400)}
/* film mode (used to record the video): fixed 16:9, no controls, Arabic subtitles */
.sub{display:none}
body.film{height:100vh;overflow:hidden}
body.film footer,body.film .tools,body.film .nav,body.film .hint,body.film details.ar,body.film .legend{display:none}
body.film header.top{padding:14px 40px}
body.film .rail{padding:6px 40px}
body.film main{max-width:1840px;padding:20px 40px 0;flex:none}
body.film .layout{grid-template-columns:minmax(0,1fr) 430px}
body.film .shot img{max-height:calc(100vh - 330px)}
body.film aside.cap{position:static}
body.film aside h2{font-size:1.5rem}body.film aside p,body.film aside ol{font-size:1.02rem}
body.film .sub{display:flex;position:fixed;left:0;right:0;bottom:0;height:140px;background:var(--petrol-900);color:#fff;align-items:center;justify-content:center;padding:0 120px;text-align:center;direction:rtl;font:500 30px/1.7 "Segoe UI",Tahoma,system-ui,sans-serif}
body.film .panel{max-width:1280px;margin-top:24px;font-size:20px}body.film .panel h1{font-size:2.8rem}body.film .pts div{font-size:1.1rem}body.film .panel p{max-width:80ch}body.film .sub.long{font-size:24px;line-height:1.6}body.film .notshown ul{font-size:1.05rem}
@media (max-width:960px){
  .layout{grid-template-columns:1fr}
  aside.cap{position:static}
  .shot{min-width:640px}.shot img{max-height:none}
  .rail{padding:8px 16px}.legend{display:none}
}
@media (max-width:520px){
  main{padding:16px}
  header.top{padding:10px 16px}.brand span{display:none}
  .panel{padding:26px 18px}
  .nav .btn{flex:1}
  .tools .counter{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="badge"><img src="assets/mark.svg" alt=""></span><b>RehletShifaa</b><span>Platform walkthrough</span></div>
  <div class="tools">
    <div class="voice"><button class="btn sm" id="play" type="button" aria-pressed="false"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z"/></svg><span>Play with Arabic voice-over</span></button></div>
    <div class="counter" id="counter" aria-live="polite"></div>
  </div>
</header>
<nav class="rail" aria-label="Journey steps">
  <ol id="rail"></ol>
  <div class="legend"><span>Click a segment to jump to a step</span><span class="keys"><span class="chip">Patient</span><span class="chip coordinator">Coordinator</span><span class="chip consultant">Consultant</span></span></div>
</nav>
<main id="stage"></main>
<footer>Demo data only. Costs shown are estimates, not prices. Use the ← → keys, or click a ringed element, to move on.</footer>
<div class="sub" id="sub" lang="ar"></div>

<script>
const IMG='assets/',AUD='assets/audio/';
const AR=["مرحبًا بكم في عرض منصّة رحلة شفاء. تنسّق المنصّة الرعاية الطبية التخصصية في مصر للمرضى القادمين من الخارج. يراجع استشاري الحالة قبل أن يسافر المريض أو يدفع أو يقرّر. ويبقى منسّق واحد، يتحدّث العربية والإنجليزية، مع المريض من أول رسالة حتى المتابعة. وتنتقل التكلفة بوضوح من تقدير أولي إلى عرض نهائي. سنتابع معًا حالة تجريبية خلال أربع عشرة خطوة.", "الخطوة الأولى: الصفحة الرئيسية. يبدأ المريض من الموقع العام، ويرى بوضوح كيف تعمل الخدمة: يرسل حالته، ثم يراجعها استشاري، ثم تصله خطة وتكلفة تقديرية. والقرار يبقى دائمًا بيد المريض.", "الخطوة الثانية: إرسال الحالة. يملأ المريض، أو من ينوب عنه، نموذجًا قصيرًا من ثلاث خطوات: بيانات المريض، ثم وصف الحالة والتقارير، ثم الموافقة والمراجعة. ولا يحتاج المريض أن يعرف التخصص المناسب، ولا أن تكون كل التقارير معه.", "الخطوة الثالثة: استلام الحالة. فور الإرسال يحصل المريض على رقم للحالة وصفحة متابعة آمنة. تقول الصفحة بوضوح إن المنسّق يراجع الحالة، وإنه لا يُطلب من المريض أي إجراء الآن، وتعرض مراحل الرحلة السبع.", "الخطوة الرابعة: مهامي، من جهة المنسّق. يبدأ المنسّق يومه من قائمة واحدة مرتّبة بحسب الأهمية. كل بند يوضّح الخطوة التالية ومن ننتظر. وتظهر الحالة الجديدة تحت عنوان: عيّن استشاريًا.", "الخطوة الخامسة: مساحة عمل الحالة. يؤكّد المنسّق مجال الرعاية، ويستكمل أي نقص، ثم يختار استشاريًا محدّدًا بالاسم. ولا يظهر في الاختيار إلا الاستشاريون أصحاب الاعتماد السارِي في هذا المجال. وفي هذه البيانات التجريبية لا يوجد استشاري مؤهّل بعد.", "الخطوة السادسة: مراجعة الاستشاري. يطّلع الاستشاري على ملف المريض ومستنداته، ويسجّل توصيته السريرية، وأي مخاطر أو قيود ينبغي أن يعرفها المريض قبل المضي. وهنا يُتّخذ القرار الطبي، قبل أي التزام مالي.", "الخطوة السابعة: التقدير الأولي. بعد توصية الاستشاري يُعدّ المنسّق التقدير الأولي، ويراه المريض في صفحته. هذا التقدير غير مُلزِم، وليس سعرًا نهائيًا. ولا يحدث شيء حتى يقرّر المريض.", "الخطوة الثامنة: التحقّق برمز لمرة واحدة. لقراءة العرض يفتح المريض الرابط الآمن، ويدخل رمزًا من ستة أرقام يصله على هاتفه أو بريده. الرمز لا يُعرض هنا أبدًا، لأن العرض يحتوي معلومات خاصة.", "الخطوة التاسعة: وديعة التنسيق. بعد القبول يدفع المريض وديعة التنسيق بتحويل بنكي، أو عبر وكيل، ثم يُدخل رقم مرجع التحويل. وتتحقق الإدارة المالية من المرجع. والبيانات البنكية في هذه الشاشة بيانات تجريبية.", "الخطوة العاشرة: تأكيد الوديعة. عند التأكّد من الدفع يرى المريض ختم الاستلام، ثم يبدأ المنسّق ترتيب العلاج. وتُخصم الوديعة من السعر النهائي لخطة العلاج.", "الخطوة الحادية عشرة: الدخول والقسيمة. عند تأكيد الدخول تعرض الحالة خطاب القبول وقسيمة المستشفى: ما أُضيف إلى حساب المستشفى، وما يدفعه المريض عند الكاشير، وما تبقّى. المبالغ بالجنيه المصري، مع سعر الصرف المثبّت.", "الخطوة الثانية عشرة: مراحل العلاج. تُسجَّل المراحل أثناء العلاج، ويصادق عليها الاستشاري. وإذا لزم علاج إضافي يُقترح أمر تغيير بسبب سريري واضح، وتسعّره الإدارة المالية قبل أن يُحتسب.", "الخطوة الثالثة عشرة: ملف الخروج. الخروج ليس زرًّا. تعرض الحالة ما ينقص، ومجموعة المستندات التي يحملها المريض معه: ملخّص الخروج، وقائمة الأدوية، وتقرير العملية، وغيرها.", "الخطوة الرابعة عشرة: المتابعة. بعد الخروج تُجدوَل مكالمات متابعة، وتصل أسئلة عن الحالة عبر رابط آمن. وإذا احتاجت إجابة إلى انتباه فهي ترجع إلى الاستشاري، ولا تُغلق الحالة قبل أن ينتهي كل شيء معلّق.", "هذه هي الرحلة كاملة. الشاشات المعروضة تعتمد على بيانات تجريبية، والتكاليف المعروضة تقديرات وليست أسعارًا. شكرًا لكم."];

const total=steps.length;
const stage=document.getElementById('stage'),counter=document.getElementById('counter'),rail=document.getElementById('rail'),sub=document.getElementById('sub'),playBtn=document.getElementById('play');
const film=/[?&]film=1/.test(location.search);if(film)document.body.classList.add('film');
let cur=0,tour=false,audio=null,timer=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip=r=>`<span class="chip ${r.toLowerCase()}">${r}</span>`;
function intro(){return `<section class="panel"><span class="rule"></span><h1>One case, from first visit to follow-up</h1>
<p>RehletShifaa coordinates specialist medical care in Egypt for international patients. This tour follows one demo case through ${total} steps, as the patient, the coordinator and the Consultant see it.</p>
<div class="pts"><div><b>Consultant review first</b>A Consultant reviews the case before the patient travels, pays or decides.</div><div><b>One bilingual coordinator</b>One person stays with the patient from the first message to follow-up.</div><div><b>Honest cost staging</b>A preliminary estimate first, a final quote later, each labelled as such.</div></div>
<div class="cta"><button class="btn" data-go="1">Start the tour</button><button class="btn ghost" id="introPlay" type="button">Play with Arabic voice-over</button></div><p class="hint">About 5 minutes with the voice-over. Screens are in English; the voice-over is in Arabic.</p></section>`}
function closing(){
 const lanes=['Patient','Coordinator','Consultant'];
 const grid=`<div class="grid"><div></div>${steps.map((s,i)=>`<div class="h">${i+1}</div>`).join('')}`+lanes.map(l=>`<div class="lane">${l}</div>`+steps.map((s,i)=>`<div class="c">${s.role===l?`<button data-go="${i+1}" aria-label="Step ${i+1}: ${esc(s.title)}">${i+1}</button>`:''}</div>`).join('')).join('')+`</div>`;
 return `<section class="panel"><span class="rule"></span><h1>The journey at a glance</h1>
<p>Who sees what, at each of the ${total} steps. Select a step to revisit it.</p>
<div class="lanes">${grid}</div>
<div class="list">${steps.map((s,i)=>`<button data-go="${i+1}"><span class="n">${i+1}</span><span class="t">${esc(s.title)}</span></button>`).join('')}</div>
<div class="notshown"><h2>Not shown yet</h2><ul>
<li>The final quote, and the patient's own outcome questionnaire (step 14 shows the team's view of follow-up).</li>
<li>An Arabic interface: the voice-over is Arabic, the screens are English.</li>
<li>Steps 11 to 14 show the Consultant's view of the case file.</li>
</ul></div>
<div class="cta"><button class="btn ghost" data-go="${total}">Back</button><button class="btn" data-go="0">Restart</button></div></section>`}
function step(i){
 const s=steps[i-1];
 const hs=s.hs.map((h,k)=>`<button class="hs${h.y<8?' below':''}" data-n="${k+1}" aria-label="${esc(h.t)}" style="left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%"><b>${k+1}</b></button>`).join('');
 return `<div class="layout"><div class="frame"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="addr">${esc(s.view)}</span><span class="sp"></span></div>
 <div class="scroller"><div class="shot"><img src="${IMG}${s.img}" width="${s.w}" height="${s.h}" alt="${esc(s.alt)}">${hs}</div></div></div>
 <aside class="cap" aria-live="polite"><span class="rule"></span>
 <div class="meta">${chip(s.role)}<small>Step ${i} of ${total}</small></div>
 <h2>${esc(s.title)}</h2><p>${esc(s.cap)}</p>
 <ol>${s.hs.map((h,k)=>`<li><b>${k+1}</b><span>${esc(h.t)}</span></li>`).join('')}</ol>
 <div class="why"><strong>Why it matters</strong>${esc(s.why)}</div>
 <details class="ar"><summary>Arabic voice-over text</summary><p lang="ar" dir="rtl">${esc(AR[i]||'')}</p></details>
 <div class="nav"><button class="btn ghost" data-go="${i-1}">Back</button><button class="btn" data-go="${i+1}">${i===total?'Summary':'Next'}</button></div>
 <p class="hint">Click a ringed element or press → to continue.</p></aside></div>`}
function stopAudio(){clearTimeout(timer);if(audio){audio.onended=null;audio.pause();audio=null}}
function playAudio(){
 stopAudio();if(!tour)return;
 const n=String(cur).padStart(2,'0');audio=new Audio(AUD+'ar-'+n+'.mp3');
 audio.onended=()=>{timer=setTimeout(()=>{if(cur>total){setTour(false)}else go(cur+1)},900)};
 audio.play().catch(()=>setTour(false));
}
function setTour(on){
 tour=on;playBtn.setAttribute('aria-pressed',on);
 playBtn.querySelector('span').textContent=on?'Pause voice-over':'Play with Arabic voice-over';
 playBtn.querySelector('svg').innerHTML=on?'<path d="M2.5 1.5h3v11h-3zM8.5 1.5h3v11h-3z"/>':'<path d="M3 1.5v11l9-5.5z"/>';
 if(on)playAudio();else stopAudio();
}
function render(){
 stage.innerHTML=cur===0?intro():cur>total?closing():step(cur);
 rail.innerHTML=steps.map((s,i)=>`<li class="${i+1<cur?'done':i+1===cur?'now':''}"><button data-go="${i+1}" aria-label="Step ${i+1}: ${esc(s.title)}" ${i+1===cur?'aria-current="step"':''}><i></i></button></li>`).join('');
 counter.textContent=cur===0?'Introduction':cur>total?'Summary':`Step ${cur} of ${total}`;
 sub.textContent=AR[cur]||'';sub.classList.toggle('long',(AR[cur]||'').length>230);
 document.title=(cur&&cur<=total?`${cur}. ${steps[cur-1].title} – `:'')+'RehletShifaa platform demo';
 const ip=document.getElementById('introPlay');if(ip)ip.onclick=()=>{go(1);setTour(true)};
 if(!film)window.scrollTo(0,0);
 playAudio();
}
function go(n){cur=Math.max(0,Math.min(total+1,n));render()}
window.go=go;
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-go]');if(b){go(+b.dataset.go);return}
 if(e.target.closest('.hs'))go(cur+1);
});
playBtn.addEventListener('click',()=>{if(cur===0)go(1);setTour(!tour)});
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);
});
render();
</script>
</body>
</html>
