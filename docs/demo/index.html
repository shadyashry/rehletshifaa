<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RehletShifaa platform demo</title>
<meta name="description" content="A click-through tour of one patient case on RehletShifaa, from sending the case to follow-up.">
<style>
:root{
  --paper:#f7f4ee;--paper-deep:#efeae0;--white:#fff;
  --petrol-50:#eef4f3;--petrol-100:#d9e8e6;--petrol-200:#b6d3cf;--petrol-600:#0e5f66;--petrol-700:#0e4f55;--petrol-900:#13292e;
  --ink-900:#14262b;--ink-600:#33474c;--ink-400:#5d6e72;
  --line:#e3ded4;--line-strong:#cfc8ba;--coral:#e07a5f;
  --radius:8px;
  --head:Alexandria,"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink-900);font:16px/1.55 var(--body);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--head);color:var(--petrol-900);margin:0;line-height:1.25;font-weight:600}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--petrol-600);outline-offset:2px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--white)}
.brand{font-family:var(--head);font-weight:600;color:var(--petrol-900);font-size:1.05rem;display:flex;align-items:center;gap:10px}
.brand i{display:block;width:22px;height:3px;background:var(--coral);border-radius:2px}
.counter{font-size:.875rem;color:var(--ink-400);font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--line)}
.progress div{height:100%;background:var(--petrol-600);width:0;transition:width .25s ease}
main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:24px 24px 16px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.frame{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.frame .scroller{overflow-x:auto}
.shot{position:relative;display:block;min-width:640px}
.shot img{display:block;width:100%;height:auto}
.hs{position:absolute;border-radius:var(--radius);border:2px solid var(--petrol-600);background:rgba(14,95,102,.06);cursor:pointer;padding:0}
.hs::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--petrol-600);animation:pulse 1.8s ease-out infinite}
.hs span{position:absolute;top:-11px;left:-11px;width:22px;height:22px;border-radius:50%;background:var(--petrol-600);color:#fff;font:600 .75rem/22px var(--body);text-align:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.06,1.18)}}
@media (prefers-reduced-motion:reduce){.hs::after{animation:none;opacity:.35}.progress div{transition:none}}
aside.cap{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:sticky;top:16px}
.rule{display:block;width:28px;height:3px;background:var(--coral);border-radius:2px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid var(--petrol-200);background:var(--petrol-50);color:var(--petrol-700)}
.chip.coordinator{background:var(--white);border-color:var(--petrol-600)}
.chip.consultant{background:var(--petrol-700);border-color:var(--petrol-700);color:#fff}
.chip.ill{background:var(--paper-deep);border-color:var(--line-strong);color:var(--ink-600);text-transform:none;letter-spacing:0;font-weight:500}
aside h2{font-size:1.25rem;margin-bottom:8px}
aside p{margin:0 0 12px;color:var(--ink-600);font-size:.95rem}
aside .why{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
aside ol{margin:0 0 12px;padding-left:0;list-style:none;font-size:.875rem;color:var(--ink-600)}
aside li{display:flex;gap:8px;margin-bottom:6px}
aside li b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--petrol-600);color:#fff;font-size:.7rem;line-height:20px;text-align:center}
.nav{display:flex;gap:12px;margin-top:16px}
.btn{border-radius:var(--radius);padding:10px 18px;font-weight:600;border:1px solid var(--petrol-600);background:var(--petrol-600);color:#fff}
.btn:hover{background:var(--petrol-700)}
.btn.ghost{background:var(--white);color:var(--petrol-700)}
.btn.ghost:hover{background:var(--petrol-50)}
.btn[disabled]{opacity:.45;cursor:default}
.hint{font-size:.8rem;color:var(--ink-400);margin-top:10px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:40px 32px;max-width:760px;margin:24px auto}
.panel h1{font-size:clamp(1.6rem,4vw,2.2rem);margin-bottom:14px}
.panel p{color:var(--ink-600);margin:0 0 14px}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0}
.pts div{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--paper);font-size:.9rem;color:var(--ink-600)}
.pts b{display:block;font-family:var(--head);font-weight:600;color:var(--petrol-900);margin-bottom:2px;font-size:.95rem}
.tl{list-style:none;margin:20px 0;padding:0;border-left:2px solid var(--petrol-200)}
.tl li{position:relative;padding:0 0 10px 18px}
.tl li::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--petrol-600)}
.tl button{background:none;border:0;padding:2px 0;text-align:left;color:var(--ink-900);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tl button:hover span.t{text-decoration:underline}
.tl .n{font-variant-numeric:tabular-nums;color:var(--ink-400);width:1.6em}
.notshown{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}
.notshown h2{font-size:1.05rem;margin-bottom:6px}
.notshown ul{margin:0;padding-left:20px;color:var(--ink-600);font-size:.9rem}
footer{padding:12px 24px 20px;text-align:center;font-size:.8rem;color:var(--ink-400)}
/* illustrative mock of the intake form (copy from en.json "Send your medical case") */
.mock{padding:28px;background:var(--paper)}
.mock .sheet{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:28px;max-width:720px;margin:0 auto}
.mock .eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--petrol-600);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mock .eyebrow i{width:16px;height:2px;background:var(--coral)}
.mock h3{font-size:1.5rem;margin-bottom:8px}
.mock .intro{color:var(--ink-600);font-size:.9rem;margin:0 0 18px}
.mock .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.mock label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-900);margin-bottom:4px}
.mock .f{border:1px solid var(--line-strong);border-radius:var(--radius);height:38px;background:var(--white);padding:0 10px;font-size:.85rem;color:var(--ink-400);display:flex;align-items:center}
.mock .f.ta{height:78px;align-items:flex-start;padding-top:9px}
.mock .help{font-size:.75rem;color:var(--ink-400);margin:4px 0 0}
.mock .field{margin-bottom:14px;position:relative}
.mock .chk{display:flex;gap:10px;font-size:.8rem;color:var(--ink-600);margin-bottom:10px}
.mock .chk i{flex:none;width:16px;height:16px;border:1px solid var(--line-strong);border-radius:4px;margin-top:2px;background:var(--white)}
.mock .send{position:relative;display:inline-block;margin-top:6px}
.mock .send .b{background:var(--petrol-600);color:#fff;border-radius:var(--radius);padding:10px 20px;font-weight:600;font-size:.9rem}
.mock .upl{position:relative}
.mock .hs{inset:-6px}
.mock .send .hs{inset:-6px}
@media (max-width:960px){
  .layout{grid-template-columns:1fr}
  aside.cap{position:static}
}
@media (max-width:520px){
  main{padding:16px}
  header.top{padding:12px 16px}
  .panel{padding:24px 18px}
  .mock{padding:12px}.mock .sheet{padding:16px}.mock .row{grid-template-columns:1fr}
  .nav .btn{flex:1}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i aria-hidden="true"></i>RehletShifaa <span style="font-weight:400;color:var(--ink-400);font-size:.9rem">platform demo</span></div>
  <div class="counter" id="counter" aria-live="polite"></div>
</header>
<div class="progress" role="progressbar" aria-label="Demo progress" aria-valuemin="0" aria-valuemax="100" id="pb"><div id="bar"></div></div>
<main id="stage"></main>
<footer>Screens show demo data and committed UI screenshots. Costs are estimates, not prices. Not medical advice. Use ← → keys, or click the pulsing rings.</footer>

<script>
const IMG='assets/';
const steps=[
/* 1: illustrative mock */
{role:'Patient',ill:true,title:'Send my case',
 mock:`<div class="mock"><div class="sheet">
  <div class="eyebrow"><i></i>A secure first step</div>
  <h3>Send your medical case</h3>
  <p class="intro">No need to know which specialty you need. Send what you already have: your coordinator prepares the file and a Consultant in the right specialty reviews it.</p>
  <div class="row"><div><label>Given name(s)</label><div class="f">Maya</div></div><div><label>Family name / surname</label><div class="f">Example</div></div></div>
  <div class="row"><div><label>Country</label><div class="f">Kenya</div></div><div><label>WhatsApp / mobile number</label><div class="f">+000 0000 0000</div></div></div>
  <div class="field"><label>Tell us briefly about your condition</label><div class="f ta">For example: what your doctors found, the treatment they suggested, and your main question.</div></div>
  <div class="field upl"><label>Upload medical reports or images</label><div class="f">Choose files</div><p class="help">Don't have all your reports? That's okay. Send what you have and your coordinator will help with the rest.</p><button class="hs" data-n="1" aria-label="Upload what you have"><span>1</span></button></div>
  <div class="chk"><i></i>I consent to RehletShifaa processing the information I submit for the purpose of coordinating my medical case.</div>
  <div class="send"><div class="b">Send my case</div><button class="hs" data-n="2" aria-label="Send my case"><span>2</span></button></div>
 </div></div>`,
 alt:'',
 cap:'The patient fills in one short form: who the patient is, a few lines about the condition, and whatever reports they already have.',
 notes:['No need to know which specialty: send what you have.','One button sends the case securely.'],
 why:'The first step is deliberately light. The coordinator checks what is missing afterwards, so the patient is not blocked.'},
{role:'Patient',title:'Case received, secure status link',img:'02-received.webp',w:1040,h:900,
 alt:'Case received page showing case number RS-2026-000417, the message "We have your case", a Received stamp and a seven-stage care journey.',
 hs:[{x:17,y:19,w:66,h:20,t:'Case number and received stamp'},{x:17,y:70,w:66,h:15,t:'The seven-stage care journey'}],
 cap:'The patient gets a case number and a secure status page right away. It says plainly that nothing is needed from them now.',
 notes:['The case number identifies this case.','The journey shows where the case stands, step by step.'],
 why:'Patients are not left guessing. They always see the stage and what happens next.'},
{role:'Coordinator',title:'My work: a case needs action',img:'03-my-work.webp',w:1440,h:900,
 alt:'Coordinator My work page listing cases in priority order, including "Review the patient\'s reply" and "Assign a Consultant", each with an Open button.',
 hs:[{x:8,y:35,w:84,h:16,t:'Most urgent item'},{x:8,y:56,w:84,h:12,t:'Assign a Consultant'}],
 cap:'The coordinator starts from one list, most urgent first. Each row says what the next step is and who it is waiting on.',
 notes:['Urgent and overdue work rises to the top.','The new case appears as "Assign a Consultant".'],
 why:'One bilingual coordinator stays with the patient, so their daily list is built around the next step in each case.'},
{role:'Coordinator',title:'Case workspace: prepare and assign',img:'04-case-prepare.webp',w:1220,h:640,
 alt:'Coordinator case workspace titled "Prepare the case for a Consultant" with a care area selector set to Cardiology.',
 hs:[{x:3,y:52,w:55,h:14,t:'Your step'},{x:3,y:80,w:34,h:17,t:'Care area'}],
 cap:'The coordinator confirms the care area, completes anything missing, then chooses a named Consultant. Only Consultants with current credentials who match the care area can be chosen.',
 notes:['The workspace shows one current step.','The care area decides which Consultants are eligible.'],
 why:'The case reaches a person qualified to review it, not a general queue. In this demo data no Consultant is listed for the area yet.'},
{role:'Consultant',title:'Consultant reviews the case',img:'05-consultant-review.webp',w:1220,h:1000,
 alt:'Consultant view of a case under review with the step "Record your clinical decision", a clinical recommendation field and the patient\'s file with documents.',
 hs:[{x:2,y:24,w:60,h:12,t:'Your step'},{x:2.5,y:64,w:62,h:17,t:'Clinical recommendation'}],
 cap:'The Consultant reads the patient\'s file and records a clinical recommendation, with any risks the patient should know before going ahead.',
 notes:['The intake summary and documents sit beside the form.','The recommendation is required; risks are optional.'],
 why:'A Consultant reviews before the patient travels, pays or decides.'},
{role:'Consultant',title:'Preliminary estimate ready',img:'06-estimate-ready.webp',w:1220,h:970,
 alt:'Patient My Care page saying "Your estimate is ready to review", with an Estimate ready stamp, a Review estimate button and a preliminary estimate of $4,850 described as non-binding.',
 hs:[{x:2.5,y:55.5,w:15,h:6.5,t:'Review estimate'},{x:52,y:40,w:11,h:11,t:'Estimate ready stamp'}],
 cap:'After the Consultant\'s recommendation, the coordinator prepares the preliminary estimate. The patient sees it as an estimate, not a final price, and nothing happens until they decide.',
 notes:['"Take the time you need — nothing happens until you decide."','The estimate is non-binding; a final quote comes after in-person assessment.'],
 why:'Honest cost staging: a preliminary estimate first, a final quote later, each labelled as such.'},
{role:'Patient',title:'Patient reviews the proposal, one-time code',img:'07-verify.webp',w:1040,h:540,
 alt:'"Verify it\'s you" screen asking for a six-digit code sent to a masked phone number ending 7898, with an empty code field.',
 hs:[{x:24.5,y:69,w:27,h:13,t:'Six-digit code field'},{x:24.5,y:86,w:11,h:9,t:'Verify'}],
 cap:'The patient opens the secure link and confirms it is them with a six-digit code sent to their phone or email. Then they can read the proposal and accept or decline.',
 notes:['The code goes only to the patient and is never shown here.','Verifying opens the proposal.'],
 why:'The proposal is private medical and cost information, so the link alone is not enough.'},
{role:'Patient',title:'Deposit: bank transfer and reference',img:'08-deposit.webp',w:1220,h:1090,
 alt:'Pay your coordination deposit screen showing the amount to pay, bank transfer and cash through an agent options, test bank details and a field for the transaction reference.',
 hs:[{x:2.5,y:37.5,w:31,h:9.5,t:'Bank transfer'},{x:2.5,y:90,w:31,h:9,t:'Bank reference'}],
 cap:'After accepting, the patient pays a coordination deposit by bank transfer, or through an agent, and enters the reference they were given. The screen shows $500 with dummy bank details.',
 notes:['The deposit is based on the preliminary estimate and is deducted from the final treatment price.','Finance checks the reference before the coordinator starts arranging care.'],
 why:'Care is arranged only once the deposit is confirmed. Online payment is shown as coming soon.'},
{role:'Coordinator',title:'Admission and voucher',img:'09-admission.webp',w:930,h:530,
 alt:'Admission and money panel marked Admitted, showing planned admission, admission letter checked, and a hospital voucher with package, platform fee and balance lines in Egyptian pounds.',
 hs:[{x:2,y:36,w:94,h:26,t:'Voucher'},{x:85,y:5,w:12,h:7,t:'Admitted status'}],
 cap:'Once admission is confirmed, the case shows the admission letter check and the hospital voucher: what is credited, what the patient pays at the cashier and what is still owed.',
 notes:['"Before admission" lists anything still blocking.','Amounts are shown in EGP, with the frozen exchange rate.'],
 why:'Everyone, including finance and the Consultant, works from the same voucher.'},
{role:'Consultant',title:'Treatment milestones',img:'10-treatment.webp',w:930,h:625,
 alt:'Treatment panel listing milestones Admitted and Procedure started, a Countersign button, and a change order for a second stent that is with Finance for pricing.',
 hs:[{x:82,y:25,w:16,h:10,t:'Countersign'},{x:2,y:47,w:50,h:15,t:'Change order'}],
 cap:'Milestones are recorded as treatment progresses. Operations records them and the Consultant countersigns. If more care is needed, a change order is proposed and priced by Finance.',
 notes:['The Consultant countersigns clinical milestones.','A change order needs a clinical reason and a price before it counts.'],
 why:'Nothing is added to the plan without a clinical reason and a visible price.'},
{role:'Coordinator',title:'Discharge pack',img:'11-discharge.webp',w:930,h:1020,
 alt:'Discharge panel with a "Before discharge" list of blockers and a discharge pack checklist: discharge summary recorded, medication list missing, operative note recorded.',
 hs:[{x:2,y:6,w:95,h:15,t:'Before discharge'},{x:2,y:23,w:95,h:29,t:'Discharge pack'}],
 cap:'Discharge is not a button. The case shows what is still missing, and the pack of documents the patient takes home: summary, medication list, operative note and more.',
 notes:['Blockers are listed in plain words.','Each document is Recorded, Missing or Not needed.'],
 why:'The patient leaves with a complete set of documents.'},
{role:'Coordinator',title:'Follow-up and outcome questions',img:'12-follow-up.webp',w:930,h:440,
 alt:'Follow-up panel with check-ins at day 3, 14 and 30, and an outcomes section with a day 30 questionnaire answered by secure link.',
 hs:[{x:2,y:2,w:95,h:44,t:'Check-ins'},{x:2,y:50,w:95,h:46,t:'Outcomes'}],
 cap:'After discharge, scheduled check-ins keep the patient in contact with the team. Outcome questions arrive by secure link; an answer that needs attention goes back to the Consultant.',
 notes:['Check-ins are scheduled and recorded.','A reported complication is reviewed by the Consultant before the case can close.'],
 why:'Care does not end at discharge, and the case closes only once nothing is outstanding.'}
];
const total=steps.length;
const stage=document.getElementById('stage'),bar=document.getElementById('bar'),counter=document.getElementById('counter'),pb=document.getElementById('pb');
let cur=0; /* 0 = intro, 1..total = steps, total+1 = closing */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function intro(){return `<section class="panel"><span class="rule"></span><h1>One case, from first message to follow-up</h1>
<p>RehletShifaa coordinates specialist medical care in Egypt for international patients. This tour follows one demo case through twelve steps, as the patient, the coordinator and the Consultant see it.</p>
<div class="pts"><div><b>Consultant review first</b>A Consultant reviews the case before the patient travels, pays or decides.</div><div><b>One bilingual coordinator</b>One person stays with the patient from the first message to follow-up.</div><div><b>Honest cost staging</b>A preliminary estimate first, a final quote later, each labelled as such.</div></div>
<div class="nav"><button class="btn" data-go="1">Start the tour</button></div><p class="hint">Takes about two minutes. English only in this version.</p></section>`}
function closing(){
 return `<section class="panel"><span class="rule"></span><h1>The journey at a glance</h1>
<ol class="tl">${steps.map((s,i)=>`<li><button data-go="${i+1}"><span class="n">${i+1}</span><span class="t">${esc(s.title)}</span><span class="chip ${s.role.toLowerCase()}">${s.role}</span>${s.ill?'<span class="chip ill">illustrative</span>':''}</button></li>`).join('')}</ol>
<div class="notshown"><h2>Not shown yet</h2><ul>
<li>Step 1 is an illustrative mock built from the product copy: no screenshot of the intake form exists yet.</li>
<li>Arabic screens: they exist for most steps but are not wired into this demo. Intake, discharge and follow-up have no Arabic screenshots yet.</li>
<li>The final quote and the patient-side outcome questionnaire: steps 6 and 12 show the preliminary estimate and the coordinator's view.</li>
</ul></div>
<div class="nav"><button class="btn ghost" data-go="${total}">Back</button><button class="btn" data-go="0">Restart</button></div></section>`}
function step(i){
 const s=steps[i-1];
 let body,hs='';
 if(s.mock){body=`<div class="shot">${s.mock}</div>`}
 else{
  hs=s.hs.map((h,k)=>`<button class="hs" data-n="${k+1}" aria-label="${esc(h.t)}" style="left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%"><span>${k+1}</span></button>`).join('');
  body=`<div class="shot"><img src="${IMG}${s.img}" width="${s.w}" height="${s.h}" alt="${esc(s.alt)}">${hs}</div>`}
 return `<div class="layout"><div class="frame"><div class="scroller">${body}</div></div>
 <aside class="cap" aria-live="polite"><span class="rule"></span>
 <div class="chips"><span class="chip ${s.role.toLowerCase()}">${s.role}</span>${s.ill?'<span class="chip ill">Illustrative</span>':''}</div>
 <h2>${i}. ${esc(s.title)}</h2><p>${esc(s.cap)}</p>
 <ol>${s.notes.map((n,k)=>`<li><b>${k+1}</b><span>${esc(n)}</span></li>`).join('')}</ol>
 <p class="why">${esc(s.why)}</p>
 <div class="nav"><button class="btn ghost" data-go="${i-1}">Back</button><button class="btn" data-go="${i+1}">${i===total?'Finish':'Next'}</button></div>
 <p class="hint">Click a pulsing ring or press → to continue.</p></aside></div>`}
function render(){
 stage.innerHTML=cur===0?intro():cur>total?closing():step(cur);
 const done=Math.min(cur,total+1)/(total+1)*100;
 bar.style.width=done+'%';pb.setAttribute('aria-valuenow',Math.round(done));
 counter.textContent=cur===0?'Introduction':cur>total?'Summary':`Step ${cur} of ${total}`;
 document.title=(cur&&cur<=total?`${cur}. ${steps[cur-1].title} – `:'')+'RehletShifaa platform demo';
 window.scrollTo(0,0);
}
function go(n){cur=Math.max(0,Math.min(total+1,n));render()}
stage.addEventListener('click',e=>{
 const b=e.target.closest('[data-go]');if(b){go(+b.dataset.go);return}
 if(e.target.closest('.hs')){go(cur+1)}
});
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);
});
render();
</script>
</body>
</html>
