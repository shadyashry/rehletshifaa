parent=keycloak
import=common/keycloak
styles=css/login.css css/rehletshifaa.css
locales=en,ar
kcHtmlClass=login-pf rehletshifaa
# UX 7-3: icons are the theme's own SVGs (rehletshifaa.css, "Icons"), drawn in currentColor, instead of FontAwesome and
# pficon font glyphs.
kcFeedbackErrorIcon=rs-icon rs-icon-error
kcFeedbackWarningIcon=rs-icon rs-icon-warning
kcFeedbackSuccessIcon=rs-icon rs-icon-success
kcFeedbackInfoIcon=rs-icon rs-icon-info
kcFormPasswordVisibilityIconShow=rs-icon rs-icon-eye
kcFormPasswordVisibilityIconHide=rs-icon rs-icon-eye-off
kcWebAuthnDefaultIcon=rs-icon rs-icon-key
kcWebAuthnUnknownIcon=rs-icon rs-icon-key
kcWebAuthnUSB=rs-icon rs-icon-usb
kcWebAuthnNFC=rs-icon rs-icon-nfc
kcWebAuthnBLE=rs-icon rs-icon-bluetooth
kcWebAuthnInternal=rs-icon rs-icon-device
kcLoginOTPListItemIconClass=rs-icon rs-icon-phone
kcAuthenticatorDefaultClass=rs-icon rs-icon-list
kcAuthenticatorRecoveryAuthnCodesClass=rs-icon rs-icon-list
kcAuthenticatorPasswordClass=rs-icon rs-icon-lock
kcAuthenticatorOTPClass=rs-icon rs-icon-phone
kcAuthenticatorWebAuthnClass=rs-icon rs-icon-key
kcAuthenticatorWebAuthnPasswordlessClass=rs-icon rs-icon-key
kcSelectAuthListItemArrowIconClass=rs-icon rs-icon-chevron
# UX 7-3 close: the portal's origin, for the expired link's sign-in and "Talk to a coordinator" (the portal's WhatsApp
# route). Keycloak substitutes ${env.*} in theme properties; deploy/oracle sets APP_ORIGIN, local dev uses the default.
rsPortalUrl=${env.APP_ORIGIN:http://localhost:3000}
