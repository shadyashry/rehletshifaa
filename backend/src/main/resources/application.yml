spring:
  application:
    name: rehletshifaa-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rehletshifaa}
    username: ${DB_USERNAME:rehletshifaa}
    password: ${DB_PASSWORD:rehletshifaa}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      ssl.enabled: ${REDIS_SSL:false}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:}
          jwk-set-uri: ${OIDC_JWK_SET_URI:}
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 16MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp.auth: ${MAIL_AUTH:false}
    properties.mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
    # JavaMail waits forever by default; a stalled SMTP server would freeze the single scheduler thread.
    # connect + write + read must stay under NotificationOutboxProcessor.SEND_MARGIN (60s).
    properties.mail.smtp.connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:5000}
    properties.mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:15000}
    properties.mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:15000}
  # Applies to every Boot-built RestClient/RestTemplate: Keycloak admin + JWKS, WhatsApp, Turnstile, FX rates.
  http.client:
    connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:5s}
    read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:15s}
  lifecycle.timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:25s}
  task.scheduling.shutdown:
    await-termination: true
    await-termination-period: ${SCHEDULER_SHUTDOWN_AWAIT:30s}
logging:
  # One JSON object per line in Elastic Common Schema (Spring Boot native, no extra library), so a shipper
  # forwards stdout to Elasticsearch unchanged and stack traces stay inside error.stack_trace instead of
  # breaking the line. LOG_FORMAT= (empty) switches to human-readable console output.
  structured:
    format.console: ${LOG_FORMAT:ecs}
    ecs.service:
      name: ${spring.application.name}
      environment: ${APP_ENVIRONMENT:local}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.rehletshifaa: ${LOG_LEVEL_APP:INFO}
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework
management:
  # P1-8: metrics and the Prometheus scrape are served on the internal metrics port only (app.management.metrics-port,
  # MetricsPort); the main port serves health.
  endpoints.web.exposure.include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes.enabled: true
      # Liveness is the process only. Readiness adds the database, the one dependency no request can do
      # without. Redis (cache/rate-limit fall back to the DB), SMTP (outbox retries), ClamAV (only upload
      # confirmation, fails closed with 503) and the Journey runtime (cutover off) must not take the whole
      # service out of rotation.
      group:
        liveness.include: livenessState
        readiness.include: readinessState,db
springdoc:
  api-docs.enabled: ${OPENAPI_ENABLED:true}
  swagger-ui.enabled: ${OPENAPI_ENABLED:true}
app:
  # P1-8: the internal port that serves /actuator/metrics and /actuator/prometheus (not published by Compose, not routed by the
  # gateway); 0 turns it off.
  management.metrics-port: ${METRICS_PORT:8090}
  # No case cutover is implied. Keep off until the complete Phase 4B parity gate passes.
  journey.runtime.enabled: ${JOURNEY_RUNTIME_ENABLED:false}
  journey.runtime.schema-update: ${JOURNEY_RUNTIME_SCHEMA_UPDATE:false}
  # Phase 7A: real new-case intake hook (JourneyProductionIntakeService). Requires journey.runtime.enabled
  # AND this flag both true. A real published+deployed JourneyVersion must also exist, or intake stays on
  # legacy authority. Existing cases are never rebound. Keep off outside an explicit, reviewed cutover.
  journey.runtime.production-intake-enabled: ${JOURNEY_RUNTIME_PRODUCTION_INTAKE_ENABLED:false}
  # Phase 7B: with the master switch above on, a new case enters Journey only if exactly one ENABLED policy
  # covers it (JourneyCutoverPolicy); none are configured by default, so every new case stays legacy. Example:
  #   app.journey.cutover.policies[0]: {id: cardiology-pilot, enabled: true, scope: CARE_CATEGORY, care-categories: [cardiology]}
  # Overlapping enabled policies invalidate the whole set (all legacy, POLICY_CONFLICT). Changes need a restart
  # and never affect already-bound cases. Read-only status: GET /api/v1/admin/journey-cutover (journey.view).
  # Redis-backed reference-data cache. Only the caches named in CacheNames exist; live workflow,
  # payment and authorization state is never cached.
  cache:
    enabled: ${CACHE_ENABLED:true}
    default-ttl: ${CACHE_DEFAULT_TTL:10m}
    ttls:
      fx-rates: ${CACHE_TTL_FX_RATES:15m}
      fx-rate-tables: ${CACHE_TTL_FX_RATE_TABLES:15m}
      care-categories: ${CACHE_TTL_CARE_CATEGORIES:1h}
      commercial-policy: ${CACHE_TTL_COMMERCIAL_POLICY:10m}
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
    api-audience: ${OIDC_API_AUDIENCE:rehletshifaa-api}
    allowed-authorized-parties: ${OIDC_ALLOWED_AUTHORIZED_PARTIES:rehletshifaa-web}
    # Keycloak Level of Authentication values: password=1, OTP MFA=2, WebAuthn/passkey=3.
    mfa-acr-values: ${MFA_ACR_VALUES:2,3}
    phishing-resistant-acr-values: ${PHISHING_RESISTANT_ACR_VALUES:3}
  claim:
    pepper: ${CLAIM_TOKEN_PEPPER:local-development-pepper-only}
    intake-grant-expiry-seconds: ${INTAKE_GRANT_EXPIRY_SECONDS:7200}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  web-base-url: ${APP_WEB_BASE_URL:http://localhost:3000}
  identity-admin:
    base-url: ${IDENTITY_ADMIN_BASE_URL:http://localhost:8180}
    realm: ${IDENTITY_ADMIN_REALM:rehletshifaa}
    client-id: ${IDENTITY_ADMIN_CLIENT_ID:staff-identity-admin}
    client-secret: ${IDENTITY_ADMIN_CLIENT_SECRET:}
    web-client-id: ${IDENTITY_ADMIN_WEB_CLIENT_ID:rehletshifaa-web}
    invite-lifespan-seconds: ${STAFF_INVITE_LIFESPAN_SECONDS:43200}
    # keycloak | simulator | auto (real provider whenever a client secret is configured)
    mode: ${IDENTITY_ADMIN_MODE:auto}
    setup-lifespan-seconds: ${PATIENT_SETUP_LIFESPAN_SECONDS:86400}
  identity-operations:
    poll-milliseconds: ${IDENTITY_OPERATION_POLL_MILLISECONDS:5000}
    initial-delay-milliseconds: ${IDENTITY_OPERATION_INITIAL_DELAY_MILLISECONDS:5000}
    max-attempts: ${IDENTITY_OPERATION_MAX_ATTEMPTS:8}
  identity-reconciliation:
    cron: ${IDENTITY_RECONCILIATION_CRON:0 20 2 * * *}
    # Set a new unique value for every restore. The workforce gate clears only after POST_RESTORE passes.
    restore-id: ${APP_IDENTITY_RESTORE_ID:}
  cors.allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000}
  crypto:
    # Versioned field-level encryption (P0-1). Key 1 is PII_ENCRYPTION_KEY; add pii-keys.<N> for a new version and point
    # active-pii-key-version at it; the rotation job rewrites values still on an older version. The index key signs the
    # blind indexes (whatsapp_hmac) and is kept separate so a data-key rotation never invalidates a lookup.
    pii-key: ${PII_ENCRYPTION_KEY:rehletshifaa-local-dev-only-change-me}
    pii-index-key: ${PII_INDEX_KEY:rehletshifaa-local-dev-only-index-key}
    active-pii-key-version: ${PII_ACTIVE_KEY_VERSION:0}
    # Cron for the key-rotation sweep; "-" leaves it off (run it after adding a key version).
    rotation-cron: ${PII_ROTATION_CRON:-}
  storage:
    mode: ${STORAGE_MODE:mock}
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:eu-central-1}
    endpoint: ${S3_ENDPOINT:}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    path-style: ${S3_PATH_STYLE:false}
    sse-algorithm: ${S3_SSE_ALGORITHM:AES256}
    kms-key-id: ${S3_KMS_KEY_ID:}
    max-bytes: ${UPLOAD_MAX_BYTES:15728640}
    max-files-per-case: ${UPLOAD_MAX_FILES_PER_CASE:25}
    max-case-bytes: ${UPLOAD_MAX_CASE_BYTES:104857600}
    presign-expiry-seconds: ${PRESIGN_EXPIRY_SECONDS:300}
    allowed-types: application/pdf,image/jpeg,image/png
    scanning-mode: ${DOCUMENT_SCANNING_MODE:signature}
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      timeout-milliseconds: ${CLAMAV_TIMEOUT_MILLISECONDS:10000}
  mail:
    mode: ${MAIL_MODE:noop}
    coordinator: ${COORDINATOR_EMAIL:coordinator@example.com}
    from: ${MAIL_FROM:no-reply@example.com}
  notifications:
    mode: ${NOTIFICATIONS_MODE:noop}
    poll-milliseconds: ${NOTIFICATION_POLL_MILLISECONDS:5000}
  credentials:
    reminder-days: ${CREDENTIAL_REMINDER_DAYS:30,7,1}
  # P1-6: service levels (SlaPolicy). The working week every staff clock is counted in: Cairo time, Saturday to
  # Thursday 10:00-20:00 by default, the window the out-of-hours WhatsApp reply states. A working day is one window.
  sla:
    zone: ${SLA_ZONE:Africa/Cairo}
    days: ${SLA_DAYS:SATURDAY,SUNDAY,MONDAY,TUESDAY,WEDNESDAY,THURSDAY}
    open: ${SLA_OPEN:10:00}
    close: ${SLA_CLOSE:20:00}
    # Working hours a Consultant has to answer an offer before it is declined for them (ConsultantOfferExpiryService);
    # the shorter figure applies to an URGENT case.
    offer-hours: ${SLA_OFFER_HOURS:48}
    urgent-offer-hours: ${SLA_URGENT_OFFER_HOURS:24}
    offer-expiry-scan-ms: ${SLA_OFFER_EXPIRY_SCAN_MS:60000}
    # How often open work that is now in the last stretch before its due time (StaffWorkService.DUE_SOON) is raised to HIGH.
    due-soon-scan-ms: ${SLA_DUE_SOON_SCAN_MS:300000}
    # P1-6 session 2: an unanswered information request (InformationRequestReminders), in calendar days from when it
    # was asked: patient reminders, then the coordinator alert, then the case is cancelled (or the request withdrawn).
    information-reminder-days: ${SLA_INFORMATION_REMINDER_DAYS:2,5}
    information-alert-day: ${SLA_INFORMATION_ALERT_DAY:7}
    information-cancel-days: ${SLA_INFORMATION_CANCEL_DAYS:30}
    information-reminder-scan-ms: ${SLA_INFORMATION_REMINDER_SCAN_MS:3600000}
  facilities:
    # Accreditation renewal reminders to the facility contact, days before expiry (FacilityAccreditationExpiryService).
    reminder-days: ${FACILITY_ACCREDITATION_REMINDER_DAYS:60,30,7}
    expiry-scan-ms: ${FACILITY_ACCREDITATION_EXPIRY_SCAN_MS:3600000}
  whatsapp:
    mode: ${WHATSAPP_MODE:noop}
    inbound:
      # How often stored inbound messages are filed into cases (WhatsAppInboundProcessor).
      poll-milliseconds: ${WHATSAPP_INBOUND_POLL_MILLISECONDS:5000}
    webhook-url: ${WHATSAPP_WEBHOOK_URL:}
    token: ${WHATSAPP_TOKEN:}
    meta:
      graph-base-url: ${WHATSAPP_META_GRAPH_BASE_URL:https://graph.facebook.com}
      graph-version: ${WHATSAPP_META_GRAPH_VERSION:v23.0}
      phone-number-id: ${WHATSAPP_META_PHONE_NUMBER_ID:}
      access-token: ${WHATSAPP_META_ACCESS_TOKEN:}
      verify-token: ${WHATSAPP_META_VERIFY_TOKEN:}
      app-secret: ${WHATSAPP_META_APP_SECRET:}
      authentication-template: ${WHATSAPP_META_AUTH_TEMPLATE:}
      authentication-template-language: ${WHATSAPP_META_AUTH_TEMPLATE_LANGUAGE:en_US}
      # Approved Meta templates per outbox key (docs/whatsapp-message-templates.md). Each is registered in both
      # languages below; link templates carry a URL button whose dynamic suffix is <lang>/<route>/<token>.
      templates:
        case-status-link: ${WHATSAPP_TEMPLATE_CASE_RECEIVED:rs_case_received}
        secure-message: ${WHATSAPP_TEMPLATE_SECURE_MESSAGE:rs_secure_message}
        patient-action-link: ${WHATSAPP_TEMPLATE_PATIENT_ACTION:rs_patient_action}
        patient-action-reminder: ${WHATSAPP_TEMPLATE_PATIENT_ACTION_REMINDER:rs_patient_action_reminder}
        information-request-closed: ${WHATSAPP_TEMPLATE_INFORMATION_REQUEST_CLOSED:rs_information_request_closed}
        proposal-ready: ${WHATSAPP_TEMPLATE_PROPOSAL_READY:rs_proposal_ready}
        final-quote-ready: ${WHATSAPP_TEMPLATE_FINAL_QUOTE_READY:rs_final_quote_ready}
        onboarding-activation: ${WHATSAPP_TEMPLATE_ONBOARDING:rs_onboarding}
        deposit-settled-patient: ${WHATSAPP_TEMPLATE_DEPOSIT_SETTLED:rs_deposit_settled}
        deposit-payment-due: ${WHATSAPP_TEMPLATE_DEPOSIT_PAYMENT_DUE:rs_deposit_payment_due}
        deposit-payment-reminder: ${WHATSAPP_TEMPLATE_DEPOSIT_PAYMENT_REMINDER:rs_deposit_payment_reminder}
        deposit-transfer-rejected: ${WHATSAPP_TEMPLATE_DEPOSIT_TRANSFER_REJECTED:rs_deposit_transfer_rejected}
        deposit-balance-due: ${WHATSAPP_TEMPLATE_DEPOSIT_BALANCE_DUE:rs_deposit_balance_due}
        document-cleared: ${WHATSAPP_TEMPLATE_DOCUMENT_CLEARED:rs_document_cleared}
        proposal-decision-recorded: ${WHATSAPP_TEMPLATE_DECISION_RECORDED:rs_decision_recorded}
        intake-followup: ${WHATSAPP_TEMPLATE_FOLLOWUP:rs_followup_window_closed}
        coordinator-intro: ${WHATSAPP_TEMPLATE_COORDINATOR_INTRO:rs_coordinator_intro}
        out-of-hours: ${WHATSAPP_TEMPLATE_OUT_OF_HOURS:rs_out_of_hours}
      languages:
        en: ${WHATSAPP_TEMPLATE_LANGUAGE_EN:en}
        ar: ${WHATSAPP_TEMPLATE_LANGUAGE_AR:ar}
  payments:
    # DEP-3: the platform account patients pay the coordination deposit into, shown on their payment step. Dummy values
    # for development and test only: set the real account through the environment before production.
    bank-transfer:
      account-name: ${PAYMENT_BANK_ACCOUNT_NAME:RehletShifaa Test Account}
      bank-name: ${PAYMENT_BANK_NAME:Test Bank (dummy details)}
      account-number: ${PAYMENT_BANK_ACCOUNT_NUMBER:0000000000000}
      iban: ${PAYMENT_BANK_IBAN:EG000000000000000000000000000}
      swift: ${PAYMENT_BANK_SWIFT:TESTEGCXXXX}
    # How often unpaid deposits are checked for the daily reminders (patient days 1-3, coordinator day 4).
    reminder-poll-milliseconds: ${PAYMENT_REMINDER_POLL_MILLISECONDS:3600000}
    # P0-2: after the coordinator alert (day 4 of the cycle) an unpaid deposit gets this many more days before the
    # case expires (ACCEPTED -> EXPIRED through the lifecycle policy); the coordinator may re-prepare it later.
    deposit-expiry-grace-days: ${PAYMENT_DEPOSIT_EXPIRY_GRACE_DAYS:14}
  turnstile:
    enabled: ${TURNSTILE_ENABLED:false}
    secret: ${TURNSTILE_SECRET:}
  rate-limit:
    requests: ${RATE_LIMIT_REQUESTS:30}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    trust-proxy: ${RATE_LIMIT_TRUST_PROXY:false}
  currency:
    enabled: ${CURRENCY_API_ENABLED:true}
    provider-url: ${CURRENCY_PROVIDER_URL:https://open.er-api.com}
    supported: ${CURRENCY_SUPPORTED:EGP,USD,EUR,SAR,AED,GBP}
