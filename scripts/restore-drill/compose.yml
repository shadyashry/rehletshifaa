# P1-9: the scratch stack scripts/restore-drill.sh restores into. Its own Compose project, network, volumes and
# loopback-only ports, so it never shares anything with the dev stack (project "rehletshifaa", ports 5432/8080/8180/9000).
# Every credential is generated by the drill for this run only and passed in the environment; nothing is stored.
name: rehletshifaa-restore-drill

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rehletshifaa
      POSTGRES_USER: rehletshifaa
      POSTGRES_PASSWORD: ${DRILL_DB_PASSWORD:?generated by restore-drill.sh}
    ports: ["127.0.0.1:${DRILL_DB_PORT:-15432}:5432"]
    volumes: ["drill-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehletshifaa"]
      interval: 3s
      timeout: 3s
      retries: 40

  # No --import-realm: the realm comes from the backup set's export, imported by the drill.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--hostname", "http://localhost:${DRILL_KEYCLOAK_PORT:-18180}"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: drill-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DRILL_KC_ADMIN_PASSWORD:?generated by restore-drill.sh}
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:${DRILL_KEYCLOAK_PORT:-18180}:8080"]
    volumes:
      - ../../infrastructure/keycloak/themes:/opt/keycloak/themes:ro

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: drill
      MINIO_ROOT_PASSWORD: ${DRILL_MINIO_PASSWORD:?generated by restore-drill.sh}
    ports: ["127.0.0.1:${DRILL_MINIO_PORT:-19000}:9000"]
    volumes: ["drill-minio:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20 }

  # SMTP for the backend's mail health check; nothing is sent (MAIL_MODE noop) and no port is published.
  mailpit:
    image: axllent/mailpit:v1.27

  # Started by the drill once the data is back. Default Spring profile: no local demo seeder over the restored data.
  # Notifications, mail and WhatsApp are off, so nothing restored can reach a real person.
  backend:
    image: ${DRILL_BACKEND_IMAGE:?set by restore-drill.sh}
    stop_grace_period: 60s
    environment:
      SPRING_PROFILES_ACTIVE: ""
      DB_URL: jdbc:postgresql://postgres:5432/rehletshifaa
      DB_USERNAME: rehletshifaa
      DB_PASSWORD: ${DRILL_DB_PASSWORD}
      APP_SECURITY_ENABLED: "true"
      OIDC_ISSUER_URI: http://localhost:${DRILL_KEYCLOAK_PORT:-18180}/realms/rehletshifaa
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/rehletshifaa/protocol/openid-connect/certs
      # The drill's smoke client presents its own tokens; the issuer, signature and audience checks are unchanged.
      OIDC_ALLOWED_AUTHORIZED_PARTIES: rehletshifaa-web,restore-drill
      # Must be the source environment's keys (secret store) or encrypted fields will not read; the defaults are the
      # dev stack's local-only values from docker-compose.yml.
      CLAIM_TOKEN_PEPPER: ${CLAIM_TOKEN_PEPPER:-local-only-claim-pepper-change-in-production}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-local-only-pii-key-change-in-production}
      PII_INDEX_KEY: ${PII_INDEX_KEY:-local-only-pii-index-key-change-in-production}
      STORAGE_MODE: s3
      AWS_ACCESS_KEY_ID: drill
      AWS_SECRET_ACCESS_KEY: ${DRILL_MINIO_PASSWORD}
      AWS_REGION: us-east-1
      S3_BUCKET: medical-documents
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${DRILL_MINIO_PORT:-19000}
      S3_PATH_STYLE: "true"
      S3_SSE_ALGORITHM: NONE
      DOCUMENT_SCANNING_MODE: signature
      NOTIFICATIONS_MODE: noop
      MAIL_MODE: noop
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      WHATSAPP_MODE: noop
      IDENTITY_ADMIN_BASE_URL: http://keycloak:8080
      IDENTITY_ADMIN_CLIENT_ID: staff-identity-admin
      IDENTITY_ADMIN_CLIENT_SECRET: ${DRILL_IDENTITY_ADMIN_SECRET:?generated by restore-drill.sh}
      FRONTEND_ALLOWED_ORIGINS: http://localhost:13000
      APP_PUBLIC_BASE_URL: http://localhost:${DRILL_BACKEND_PORT:-18080}
      APP_WEB_BASE_URL: http://localhost:13000
      OPENAPI_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["127.0.0.1:${DRILL_BACKEND_PORT:-18080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
      keycloak: { condition: service_started }

volumes:
  drill-postgres:
  drill-minio:
